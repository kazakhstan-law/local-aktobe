title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения и культуры, являющимся гражданскими служащими и работающим в сельских населенных пунктах Мугалжарского района
  kaz: «Мұғалжар ауданы бойынша азаматтық қызметшілер болып табылатын және ауылдық елді мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру және мәдениет саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелерді белгілеу туралы»
