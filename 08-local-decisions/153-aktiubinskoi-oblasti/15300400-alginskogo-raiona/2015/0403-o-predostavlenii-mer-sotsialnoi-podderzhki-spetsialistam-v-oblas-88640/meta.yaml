requisite: Решение маслихата Алгинского района Актюбинской области от 3 апреля 2015 года № 199. Зарегистрировано Департаментом юстиции Актюбинской области 15 апреля 2015 года № 4306. Утратило силу решением маслихата Алгинского района Актюбинской области от 23 декабря 2015 года № 252
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Алгинского района на 2015 год
  kaz: Алға ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылға әлеуметтік қолдау шараларын ұсыну туралы
