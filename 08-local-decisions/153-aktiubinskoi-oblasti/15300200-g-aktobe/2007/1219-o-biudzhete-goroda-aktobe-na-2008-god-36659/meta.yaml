    kaz: Ақтөбе қалалық мәслихатының кезекті үшінші сессиясының 2007 жылғы 19 желтоқсандағы N 24 "2008 жылға арналған Ақтөбе қаласының бюджеті туралы" Ақтөбе қаласының әділет басқармасында 2008 жылғы 10 қаңтардағы N 3-1-82 санымен тіркелген шешіміне өзгерістер мен толықтырулар енгізу туралы
