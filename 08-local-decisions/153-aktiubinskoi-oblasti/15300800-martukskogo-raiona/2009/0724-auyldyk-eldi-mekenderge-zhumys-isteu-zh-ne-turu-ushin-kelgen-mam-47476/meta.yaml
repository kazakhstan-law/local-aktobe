requisite: Ақтөбе облысы Мәртөк аудандық мәслихатының 2009 жылғы 24 шілдедегі N 124 шешімі. Ақтөбе облысы Мәртөк аудандық әділет басқармасында 2009 жылғы 18 тамызда N 3-8-94 тіркелді. Күші жойылды - Ақтөбе облысы Мәртөк аудандық мәслихатының 2010 жылғы 5 ақпандағы N 152 шешімімен
