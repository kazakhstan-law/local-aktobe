  title:
    rus: О внесении изменения в решение Кобдинского районного маслихата от 4 января 2019 года № 208 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Кобдинского района на 2019 год»
    kaz: Қобда аудандық мәслихатының 2019 жылғы 4 қаңтардағы № 208 «Қобда ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылға әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
