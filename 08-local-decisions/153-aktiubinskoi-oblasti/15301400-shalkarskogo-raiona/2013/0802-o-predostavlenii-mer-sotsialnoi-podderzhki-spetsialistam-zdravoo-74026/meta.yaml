requisite: Решение маслихата Шалкарского района Актюбинской области от 2 августа 2013 года № 96. Зарегистрировано Департаментом юстиции Актюбинской области 21 августа 2013 года № 3637. Утратило силу решением маслихата Шалкарского района Актюбинской области от 24 февраля 2014 года № 134
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района в 2013 году
  kaz: 2013 жылы ауданның ауылдық елді мекендеріне жұмыс істеуге және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
