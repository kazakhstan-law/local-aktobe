  title:
    rus: О внесении изменения в решение Мугалжарского районного маслихата от 12 апреля 2016 года № 14 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Мугалжарском районе»
    kaz: Мұғалжар аудандық мәслихатының 2016 жылғы 12 сәуірдегі № 14 «Мұғалжар ауданында әлеуметтік көмек көрсету, мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
