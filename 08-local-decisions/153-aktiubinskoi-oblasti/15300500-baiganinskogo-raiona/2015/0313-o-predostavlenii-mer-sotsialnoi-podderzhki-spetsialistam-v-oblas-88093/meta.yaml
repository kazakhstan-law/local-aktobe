act_code: '88093'
requisite: Решение Байганинского районного маслихата Актюбинской области от 13 марта 2015 года № 159. Зарегистрировано Департаментом юстиции Актюбинской области 3 апреля 2015 года № 4279. Утратило силу решением маслихата Байганинского района Актюбинской области от 29 февраля 2016 года № 217
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Байганинского района на 2015 год
  kaz: Байғанин ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылға әлеуметтік қолдау шараларын ұсыну туралы
