requisite: Решение акима Жарыкского сельского округа Кобдинского района Актюбинской области от 3 марта 2021 года № 6. Зарегистрировано Департаментом юстиции Актюбинской области 4 марта 2021 года № 8077. Утратило силу решением акима Жарыкского сельского округа Кобдинского района Актюбинского области от 18 октября 2021 года № 15
title:
