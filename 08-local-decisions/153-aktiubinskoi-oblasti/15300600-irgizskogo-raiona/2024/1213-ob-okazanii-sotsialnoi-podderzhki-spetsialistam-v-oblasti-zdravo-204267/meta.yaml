act_code: '204267'
requisite: Решение Иргизского районного маслихата Актюбинской области от 13 декабря 2024 года № 176
title:
  rus: Об оказании социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов,прибывшим для работы и проживания в сельские населенные пункты Иргизского района на 2025 год
  kaz: Ырғыз ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2025 жылға әлеуметтік қолдау көрсету туралы
