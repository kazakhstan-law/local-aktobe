act_code: '135196'
requisite: Решение Кобдинского районного маслихата Актюбинской области от 4 октября 2019 года № 257. Зарегистрировано Департаментом юстиции Актюбинской области 10 октября 2019 года № 6407. Утратило силу решением Кобдинского районного маслихата Актюбинской области от 20 августа 2020 года № 361
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Кобдинского района
  kaz: Қобда ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
