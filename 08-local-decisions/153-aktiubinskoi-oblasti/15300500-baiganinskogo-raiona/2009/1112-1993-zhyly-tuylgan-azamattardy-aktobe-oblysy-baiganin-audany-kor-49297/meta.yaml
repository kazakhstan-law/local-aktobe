act_code: '49297'
requisite: Ақтөбе облысы Байғанин ауданының әкімінің 2009 жылғы 12 қарашадағы № 11 шешімі. Ақтөбе облысының Байғанин аудандық Әділет басқармасында 2009 жылдың 10 желтоқсанда N 3-4-87 тіркелді. Күші жойылды - Ақтөбе облысы Байғанин ауданының әкімінің 2010 жылғы 11 мамырдағы № 4 шешімімен
