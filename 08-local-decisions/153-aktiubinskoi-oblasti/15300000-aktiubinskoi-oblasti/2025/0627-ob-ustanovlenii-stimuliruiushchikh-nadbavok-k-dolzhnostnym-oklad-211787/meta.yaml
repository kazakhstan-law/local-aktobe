act_code: '211787'
requisite: Решение Актюбинского областного маслихата от 27 июня 2025 года № 228
title:
  rus: Об установлении стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Служба обеспечения мобилизационной подготовки, территориальной и гражданской обороне» государственного учреждения «Управление по мобилизационной подготовке, территориальной и гражданской обороне Актюбинской области», финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын «Ақтөбе облысының жұмылдыру дайындығы, аумақтық және азаматтық қорғаныс басқармасы» мемлекеттік мекемесінің «Жұмылдыру дайындығын, аумақтық және азаматтық қорғанысты қамтамасыз ету қызметі» коммуналдық мемлекеттік мекемесі қызметкерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу туралы
