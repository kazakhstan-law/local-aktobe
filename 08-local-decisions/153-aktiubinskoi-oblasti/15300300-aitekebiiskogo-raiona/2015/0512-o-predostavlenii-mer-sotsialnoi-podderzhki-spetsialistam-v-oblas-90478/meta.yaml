requisite: Решение маслихата Айтекебийского района Актюбинской области от 12 мая 2015 года № 238. Зарегистрировано Департаментом юстиции Актюбинской области 29 мая 2015 года № 4335. Заголовок в редакции решения маслихата Айтекебийского района Актюбинской области от 10.11.2015 № 267. Утратило силу решением маслихата Айтекебийского района Актюбинской области от 29 февраля 2016 года № 305
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Айтекебийского района на 2015 год
  kaz: Әйтеке би ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылға әлеуметтік қолдау шараларын ұсыну туралы
