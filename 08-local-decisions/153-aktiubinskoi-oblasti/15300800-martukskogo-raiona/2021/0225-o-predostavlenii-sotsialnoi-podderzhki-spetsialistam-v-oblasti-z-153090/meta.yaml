act_code: '153090'
requisite: Решение Мартукского районного маслихата Актюбинской области от 25 февраля 2021 года № 12. Зарегистрировано Департаментом юстиции Актюбинской области 1 марта 2021 года № 8069
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Мартукского района на 2021 год
  kaz: Мәртөк ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылға әлеуметтік қолдау көрсету туралы
