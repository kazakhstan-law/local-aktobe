requisite: Атырау облысы Махамбет ауданы Ақтоғай селолық округі әкімінің 2009 жылғы 27 қазандағы № 12 шешімі. Атырау облысы Әділет департаменті Махамбет ауданының Әділет басқармасында 2009 жылғы 26 қарашада № 4-3-133 тіркелді. Күші жойылды - Атырау облысы Махамбет ауданы Ақтоғай селолық округі әкімінің 2010 жылғы 18 қарашадағы № 30 шешімімен
