title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения и культуры, являющимся гражданскими служащими и работающим в сельских населенных пунктах Каргалинского района
  kaz: Азаматтық қызметші болып табылатын және Қарғалы ауданының ауылдық елді мекендерінде жұмыс істейтін әлеуметтік қамсыздандыру және мәдениет саласындағы мамандарға, жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
