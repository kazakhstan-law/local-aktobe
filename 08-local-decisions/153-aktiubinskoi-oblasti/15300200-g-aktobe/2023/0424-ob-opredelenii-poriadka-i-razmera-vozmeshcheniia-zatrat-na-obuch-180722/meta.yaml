requisite: Решение маслихата города Актобе Актюбинской области от 24 апреля 2023 года № 14. Зарегистрировано Департаментом юстиции Актюбинской области 27 апреля 2023 года № 8334
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Актобе
