  title:
    rus: О внесении изменения в решение Хромтауского районного маслихата от 27 августа 2021 года № 89 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Хромтауского районного маслихата»»
    kaz: Хромтау аудандық мәслихатының 2021 жылғы 27 тамыздағы № 89 ««Хромтау аудандық мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» шешіміне өзгеріс енгізу туралы
