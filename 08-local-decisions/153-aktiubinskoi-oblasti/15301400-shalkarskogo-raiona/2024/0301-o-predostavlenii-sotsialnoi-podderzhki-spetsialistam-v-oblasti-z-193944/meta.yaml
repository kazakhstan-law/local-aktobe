  title:
    rus: О внесении изменения в решение Шалкарского районного маслихата от 1 марта 2024 года № 198 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Шалкарского района на 2024 год
    kaz: Шалқар аудандық мәслихатының 2024 жылғы 1 наурыздағы № 198 «Шалқар ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер əкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылға әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
