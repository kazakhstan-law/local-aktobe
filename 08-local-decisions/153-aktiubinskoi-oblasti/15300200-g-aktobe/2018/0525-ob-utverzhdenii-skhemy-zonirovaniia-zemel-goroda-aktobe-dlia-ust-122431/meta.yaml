title:
  rus: Об утверждении схемы зонирования земель города Актобе для установления границ ценовых зон и дифференциации базовых ставок земельного налога в пределах границ, определенных Генеральным планом города Актобе
  kaz: Ақтөбе қаласының Бас жоспарында анықталған шекте жерге жер салығына базалық ставкаларды дифференциациялау мен бағалау аймақтары шекараларын белгілеу үшін Ақтөбе қаласы жерлерін аймақтарға бөлу схемасын бекіту туралы
