act_code: '86033'
requisite: Решение маслихата Темирского района Актюбинской области от 23 декабря 2014 года № 222. Зарегистрировано Департаментом юстиции Актюбинской области 21 января 2015 года № 4172. Утратило силу решением Темирского районного маслихата Актюбинской области от 10 июня 2015 года № 252
title:
  rus: О предоставлении подъемного пособия и социальной поддержки специалистам сфер здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Темирского района в 2015 году
  kaz: 2015 жылы Темір ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен салаларының мамандарына көтерме жәрдемақы мен әлеуметтік қолдауды көрсету туралы
