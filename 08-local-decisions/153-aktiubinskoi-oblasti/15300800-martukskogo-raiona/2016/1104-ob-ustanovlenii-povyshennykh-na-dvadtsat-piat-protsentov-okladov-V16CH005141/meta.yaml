  title:
    rus: О внесении изменений в решение Мартукского районного маслихата от 4 ноября 2016 года № 40 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта, ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах Мартукского района»
    kaz: Мәртөк аудандық мәслихатының 2016 жылғы 4 қарашадағы № 40 «Азаматтық қызметшілер болып табылатын және Мәртөк ауданының ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария саласындағы мамандарға, жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы» шешіміне өзгерістер енгізу туралы
