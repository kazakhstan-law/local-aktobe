requisite: Ақтөбе облысы Алға аудандық мәслихатының 2008 жылғы 23 желтоқсандағы N 3 шешімі. Ақтөбе облысының Алға аудандық Әділет басқармасында 2009 жылғы 14 қаңтарда N 3-3-68 тіркелді. Шешімнің қабылдау мерзімінің отуіне байланысты қолдану тоқтатылды - Ақтөбе облысы Алға аудандық мәслихатының 2009 жылғы 31 желтоқсандағы N 0-04/413 хатымен
