act_code: '119161'
requisite: Решение маслихата Мугалжарского района Актюбинской области от 30 января 2018 года № 150. Зарегистрировано Управлением юстиции Мугалжарского района Актюбинской области 26 февраля 2018 года № 3-9-176
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мугалжарского района на 2018 год
  kaz: Мұғалжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылға әлеуметтік қолдау көрсету туралы
