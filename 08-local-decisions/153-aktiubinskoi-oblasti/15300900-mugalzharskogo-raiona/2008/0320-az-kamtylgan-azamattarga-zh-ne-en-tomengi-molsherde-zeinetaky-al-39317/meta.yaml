requisite: Ақтөбе облысы Мұғалжар аудандық мәслихатының 2008 жылғы 20 наурыздағы № 38 шешімі. Ақтөбе облысы Мұғалжар ауданының Әділет басқармасында 2008 жылғы 23 сәуірде № 3-9-61 болып тіркелді. Күші жойылды - Ақтөбе облысы Мұғалжар аудандық мәслихатының 2009 жылғы 26 наурыздағы № 100 шешімімен
