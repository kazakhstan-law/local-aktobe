act_code: '216449'
requisite: Решение маслихата города Актобе Актюбинской области от 30 октября 2025 года № 334
title:
  rus: Об установлении стимулирующих надбавок к должностным окладам работников коммунальных государственных учреждений «Молодежный ресурсный центр города Актобе» и «Центр по вопросам религий и связям с общественностью» государственного учреждения «Отдел внутренней политики города Актобе», финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын «Ақтөбе қаласының ішкі саясат бөлімі» мемлекеттік мекемесінің «Ақтөбе қаласының жастар ресурстық орталығы» және «Дін мәселелері және қоғаммен байланыс жөніндегі орталығы» коммуналдық мемлекеттік мекемелері қызметкерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу туралы
