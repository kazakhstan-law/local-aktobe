requisite: Ақтөбе облысы Байғанин аудандық әкімінің 2010 жылғы 21 желтоқсандағы № 9 шешімі. Ақтөбе облысының Әділет департаментінде 2010 жылғы 30 желтоқсанда № 3-4-106 тіркелді. Күші жойылды - Ақтөбе облысы Байғанин аудандық әкімінің 2011 жылғы 7 желтоқсандағы № 18 шешімімен
