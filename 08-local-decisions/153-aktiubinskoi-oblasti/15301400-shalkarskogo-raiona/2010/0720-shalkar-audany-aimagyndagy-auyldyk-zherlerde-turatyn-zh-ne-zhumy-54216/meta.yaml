act_code: '54216'
requisite: Ақтөбе облысы Шалқар аудандық мәслихатының 2010 жылғы 20 шілдедегі № 211 шешімі. Ақтөбе облысы Шалқар ауданының Әділет басқармасында 2010 жылғы 24 тамызда № 3-13-139 тіркелді. Күші жойылды - Ақтөбе облысы Шалқар аудандық мәслихатының 2013 жылғы 29 маусымдағы № 85 шешімімен
title:
  rus: Шалқар ауданы аймағындағы ауылдық жерлерде тұратын және жұмыс істейтін денсаулық сақтау, білім беру, мәдениет спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек мөлшерін белгілеу туралы
