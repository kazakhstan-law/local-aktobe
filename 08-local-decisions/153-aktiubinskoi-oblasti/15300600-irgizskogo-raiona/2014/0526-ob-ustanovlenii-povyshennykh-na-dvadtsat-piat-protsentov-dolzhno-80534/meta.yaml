requisite: Решение маслихата Иргизского района Актюбинской области от 26 мая 2014 года № 142. Зарегистрировано Департаментом юстиции Актюбинской области 5 июня 2014 года № 3922. Утратило силу решением маслихата Иргизского района Актюбинской области от 29 февраля 2016 года № 241
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимися гражданскими служащими и работающими в сельской местности по Иргизскому району
  kaz: Ырғыз ауданы бойынша азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, медениет, спорт және ветеринария саласындағы мамандарына жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларды белгілеу туралы
