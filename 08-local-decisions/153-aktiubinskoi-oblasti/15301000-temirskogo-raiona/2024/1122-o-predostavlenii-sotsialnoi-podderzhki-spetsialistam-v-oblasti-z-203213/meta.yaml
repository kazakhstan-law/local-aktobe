act_code: '203213'
requisite: Решение Темирского районного маслихата Актюбинской области от 22 ноября 2024 года № 258
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Темирского района на 2025 год
  kaz: Темір ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2025 жылға әлеуметтік қолдау көрсету туралы
