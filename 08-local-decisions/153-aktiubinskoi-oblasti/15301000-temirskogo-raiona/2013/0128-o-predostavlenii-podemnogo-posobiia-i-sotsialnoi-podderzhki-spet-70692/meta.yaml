act_code: '70692'
requisite: Решение маслихата Темирского района Актюбинской области от 28 января 2013 года № 84. Зарегистрировано Департаментом юстиции Актюбинской области 6 февраля 2013 года № 3516. Утратило силу решением маслихата Темирского района Актюбинской области от 19 февраля 2014 года № 170
title:
  rus: О предоставлении подъемного пособия и социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Темирского района
  kaz: Темір ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы мен әлеуметтік қолдауды көрсету туралы
