act_code: '52268'
requisite: Ақтөбе облысы Әйтеке би аудандық мәслихатының 2010 жылғы 16 сәуірдегі № 188 шешімі. Ақтөбе облысының Әйтеке би аудандық Әділет басқармасында 2010 жылғы 29 сәуірде № 3-2-93 тіркелді. Күші жойылды - Ақтөбе облысы Әйтеке би аудандық мәслихатының 2011 жылғы 2 ақпандағы № 227 шешімімен
