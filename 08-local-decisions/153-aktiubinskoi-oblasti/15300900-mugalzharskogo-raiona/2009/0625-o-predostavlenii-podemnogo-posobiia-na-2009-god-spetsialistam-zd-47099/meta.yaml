act_code: '47099'
requisite: Решение маслихата Мугалжарского района Актюбинской области от 25 июня 2009 года N 122. Зарегистрировано Управлением юстиции Мугалжарского района 28 июля 2009 года за N 3-9-103. Утратило силу решением маслихата Мугалжарского района Актюбинской области от 31 наурызда 2010 года N 180
title:
  rus: О предоставлении подъемного пособия на 2009 год специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Мугалжарского района
  kaz: Мұғалжар ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2009 жылға көтерме жәрдемақы беру туралы
