  title:
    rus: О внесении изменений в решение областного маслихата от 11 декабря 2015 года № 349 «Об утверждении Правил содержания и защиты зеленых насаждений, Правил благоустройства территорий городов и населенных пунктов Актюбинской области»
    kaz: «Ақтөбе облысының қалалары мен елді мекендерінің аумақтарын абаттандыру қағидаларын, Жасыл екпелерді күтіп-ұстау және қорғау қағидаларын бекіту туралы» облыстық мәслихаттың 2015 жылғы 11 желтоқсандағы № 349 шешіміне өзгерістер енгізу туралы
