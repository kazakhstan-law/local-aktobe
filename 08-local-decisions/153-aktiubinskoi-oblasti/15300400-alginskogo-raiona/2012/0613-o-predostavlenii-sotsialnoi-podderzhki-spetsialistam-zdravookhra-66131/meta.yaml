requisite: Решение маслихата Алгинского района Актюбинской области от 13 июня 2012 года № 33. Зарегистрировано Департаментом юстиции Актюбинской области 19 июня 2012 года № 3-3-144. Утратило силу в связи с истечением срока применения - (письмо маслихата Алгинского района Актюбинской области от 21 января 2013 года № 02-6/15)
title:
  rus: О предоставлении социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные пункты района в 2012 году
  kaz: Ауданның ауылдық елді мекендеріне 2012 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына қолдау көрсету туралы
