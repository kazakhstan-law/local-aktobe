requisite: Ақтөбе облысы Шалқар аудандық мәслихатының 2010 жылғы 20 шілдедегі № 212 шешімі. Ақтөбе облысы Шалқар ауданының Әділет басқармасында 2010 жылғы 24 тамызда № 3-13-138 тіркелді. Күші жойылды - Ақтөбе облысы Шалқар аудандық мәслихатының 2017 жылғы 22 мамырдағы № 112 шешімімен
