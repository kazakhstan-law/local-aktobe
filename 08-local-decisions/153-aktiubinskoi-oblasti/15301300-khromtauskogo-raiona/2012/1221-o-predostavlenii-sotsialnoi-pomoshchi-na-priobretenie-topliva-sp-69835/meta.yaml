requisite: Решение маслихата Хромтауского района Актюбинской области от 21 декабря 2012 года № 83. Зарегистрировано Департаментом юстиции Актюбинской области 10 января 2013 года № 3489. Утратило силу решением маслихата Хромтауского района Актюбинской области от 21 ноября 2018 года № 246
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах района
  kaz: Ауданның ауылдық елді мекендерінде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мемлекеттік ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
