act_code: '131994'
requisite: Решение Хромтауского районного маслихата Актюбинской области от 22 мая 2019 года № 320. Зарегистрировано Департаментом юстиции Актюбинской области 27 мая 2019 года № 6198. Утратило силу решением Хромтауского районного маслихата Актюбинской области от 24 августа 2020 года № 497
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Хромтауского района
  kaz: Хромтау ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
