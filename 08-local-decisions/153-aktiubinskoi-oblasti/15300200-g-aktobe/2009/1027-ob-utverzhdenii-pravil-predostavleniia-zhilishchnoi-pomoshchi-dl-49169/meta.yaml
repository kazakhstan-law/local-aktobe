requisite: Решение маслихата города Актобе Актюбинской области от 27 октября 2009 года N 202. Зарегистрировано Управлением юстиции города Актобе Актюбинской области 8 декабря 2009 года N 3-1-123. Утратило силу решением маслихата города Актобе Актюбинской области от 28 июля 2010 года № 265
title:
  rus: Об утверждении Правил предоставления жилищной помощи для возмещения расходов за потребление коммунальных услуг и компенсации повышения тарифов абонентской платы за телефон населению города Актобе
  kaz: Ақтөбе қаласының тұрғындарына коммуналдық қызметтерді тұтынғаны үшін және телефонға абоненттік ақы тарифтерінің өсуіне байланысты шығындарды өтеуге арналған тұрғын үй көмегін беру Ережесін бекіту туралы
