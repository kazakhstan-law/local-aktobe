act_code: '117503'
requisite: Решение маслихата Каргалинского района Актюбинской области от 11 декабря 2017 года № 193. Зарегистрировано Департаментом юстиции Актюбинской области 27 декабря 2017 года № 5779
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Каргалинского района, на 2018 год
  kaz: Қарғалы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылға әлеуметтік қолдау көрсету туралы
