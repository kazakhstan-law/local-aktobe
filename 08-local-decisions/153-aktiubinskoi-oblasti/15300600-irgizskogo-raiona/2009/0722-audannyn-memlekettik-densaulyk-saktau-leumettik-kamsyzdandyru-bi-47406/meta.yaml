requisite: Ақтөбе облысы Ырғыз аудандық мәслихатының 2009 жылғы 22 шілдедегі № 93 шешімі. Ақтөбе облысының Ырғыз аудандық әділет басқармасында 2009 жылдың 10 тамызда N 3-5-102 тіркелді. Күші жойылды - Ақтөбе облысы Ырғыз аудандық мәслихатының 2012 жылғы 1 қарашадағы № 39 шешімімен; 2013 жылғы 3 қаңтардағы № 1 хатымен
title:
  rus: Ауданның мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
