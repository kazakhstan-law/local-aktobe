title:
  rus: Об утверждении проектов (схем) зонирования земель и поправочных коэффициентов к базовым ставкам платы за земельные участки и границы оценочных зон в городах Кандыагаш, Эмба, Жем и сельских населенных пунктах Мугалжарского района
  kaz: Мұғалжар ауданының Қандыағаш, Ембі, Жем қалалары мен ауылдық елді мекендерінде жерді аймақтарға бөлу жобаларын (схемаларын) және бағалау аймақтарының шекаралары мен жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы
