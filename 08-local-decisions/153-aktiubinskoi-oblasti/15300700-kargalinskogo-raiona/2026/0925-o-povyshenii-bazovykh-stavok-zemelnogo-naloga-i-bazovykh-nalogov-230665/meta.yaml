requisite: Решение Каргалинского районного маслихата Актюбинской области от 25 сентября 2026 года № 500
title:
  rus: О повышении базовых ставок земельного налога и базовых налоговых ставок на земли, занятые жилищным фондом, в том числе строениями и сооружениями при нем по Каргалинскому району
  kaz: Қарғалы ауданы бойынша жер салығының базалық мөлшерлемелерін және тұрғын үй қоры, соның ішінде оның жанындағы құрылыстар мен құрылысжайлар алып жатқан жерге базалық салықтық мөлшерлемелерін арттыру туралы
