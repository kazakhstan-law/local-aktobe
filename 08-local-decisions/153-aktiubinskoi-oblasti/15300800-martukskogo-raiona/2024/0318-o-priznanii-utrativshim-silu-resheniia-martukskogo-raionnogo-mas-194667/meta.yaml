act_code: '194667'
requisite: Решение Мартукского районного маслихата Актюбинской области от 18 марта 2024 года № 103. Зарегистрировано Департаментом юстиции Актюбинской области 20 марта 2024 года № 8532-04
title:
  rus: О признании утратившим силу решения Мартукского районного маслихата от 6 февраля 2024 года № 85 «Об оказании дополнительной социальной помощи отдельным категориям нуждающихся граждан Мартукского района к 35-летию вывода ограниченного контингента советских войск из Демократической Республики Афганистан»
  kaz: Мәртөк аудандық мәслихатының 2024 жылғы 6 ақпандағы № 85 «Ауғанстан Демократиялық Республикасынан Кеңес әскерлерінің шектеулі контингентін шығаруының 35-жылдығына орай Мәртөк ауданының мұқтаж азаматтарының санаттарына қосымша әлеуметтік көмек көрсету туралы» шешімінің күшін жою туралы
