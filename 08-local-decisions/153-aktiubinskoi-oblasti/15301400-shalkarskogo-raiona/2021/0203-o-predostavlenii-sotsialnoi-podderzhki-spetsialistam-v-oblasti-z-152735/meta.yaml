act_code: '152735'
requisite: Решение Шалкарского районного маслихата Актюбинской области от 3 февраля 2021 года № 11. Зарегистрировано Департаментом юстиции Актюбинской области 5 февраля 2021 года № 8045
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Шалкарского района на 2021 год
  kaz: Шалқар ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер əкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылға әлеуметтік қолдау көрсету туралы
