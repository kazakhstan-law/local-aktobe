requisite: Ақтөбе облысы Мәртөк аудандық мәслихатының 2009 жылғы 24 сәуірдегі N 101 шешімі. Ақтөбе облысының Мәртөк аудандық Әділет басқармасында 2009 жылдың 27 мамырда N 3-8-89 тіркелді. Күші жойылды - Ақтөбе облысы Мәртөк аудандық мәслихатының 2012 жылғы 9 тамыздағы № 34 шешімімен
title:
