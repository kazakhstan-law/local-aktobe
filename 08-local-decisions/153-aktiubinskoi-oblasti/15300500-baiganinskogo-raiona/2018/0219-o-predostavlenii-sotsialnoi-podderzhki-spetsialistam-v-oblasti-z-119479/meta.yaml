requisite: Решение маслихата Байганинского района Актюбинской области от 19 февраля 2018 года № 135. Зарегистрировано Управлением юстиции Байганинского района Актюбинской области 6 марта 2018 года № 3-4-155
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Байганинского района на 2018 год
  kaz: Байғанин ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылға әлеуметтік қолдау көрсету туралы
