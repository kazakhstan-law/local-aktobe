requisite: Решение маслихата Байганинского района Актюбинской области от 25 октября 2011 года № 190. Зарегистрировано Департаментом юстиции Актюбинской области 14 ноября 2011 года № 3-4-129. Утратило силу в связи с истечением срока применения - (письмо маслихата Байганинского района Актюбинской области от 25 апреля 2012 года № 05-11/235)
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта прибывшим для работы и проживания в сельские населенные пункты района в 2011 году
