act_code: '140634'
requisite: Решение Алгинского районного маслихата Актюбинской области от 13 марта 2020 года № 346. Зарегистрировано Департаментом юстиции Актюбинской области 18 марта 2020 года № 6903
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Алгинского района на 2020 год
  kaz: Алға ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер əкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылға әлеуметтік қолдау көрсету туралы
