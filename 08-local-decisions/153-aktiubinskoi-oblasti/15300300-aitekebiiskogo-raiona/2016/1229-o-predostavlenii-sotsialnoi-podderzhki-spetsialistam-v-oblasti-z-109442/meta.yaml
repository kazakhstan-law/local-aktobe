requisite: Решение маслихата Айтекебийского района Актюбинской области от 29 декабря 2016 года № 94. Зарегистрировано Департаментом юстиции Актюбинской области 19 января 2017 года № 5233
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Айтекебийского района на 2017 год
  kaz: 2017 жылға Әйтеке би ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы
