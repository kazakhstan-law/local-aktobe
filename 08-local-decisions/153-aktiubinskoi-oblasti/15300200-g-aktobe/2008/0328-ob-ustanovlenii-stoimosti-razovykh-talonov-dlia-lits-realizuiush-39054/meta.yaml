  requisite: Решение маслихата города Актобе Актюбинской области от 30 сентября 2008 года N 92. Зарегистрировано в управлении юстиции города Актобе Актюбинской области 22 октября 2008 года за N 3-1-96. Утратило силу решением маслихата города Актобе Актюбинской области от 24 декабря 2009 года № 216
  title:
    rus: О внесении изменений и дополнений в решение очередной пятой сессии маслихата города Актобе от 28 марта 2008 года N 51 "Об утверждении стоимости разовых талонов для лиц реализующих товары на крытых рынках "Достык" и "Арай" с применением коэффициентов к месячному расчетному показателю, утвержденному на соответствующий период" зарегистрированного в управлении юстиции города Актобе от 21 апреля 2008 года за N 3-1-86
    kaz: Ақтөбе қалалық әділет басқармасында 2008 жылғы 21 сәуірдегі N 3-1-86 санымен тіркелген Ақтөбе қалалық мәслихатының кезекті бесінші сессиясының 2008 жылғы 28 наурыздағы N 51 "Достық" және "Арай" жабық базарларында тауар сатушы тұлғалар үшін бір жолғы талондар құнының мөлшерін сол кезеңге сәйкес бекітілген айлық есептік көрсеткішіне коэффициенттерді қолдану арқылы бекіту туралы" шешіміне өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/42017/rus
