requisite: Решение маслихата Алгинского района Актюбинской области от 17 апреля 2014 года № 152. Зарегистрировано Департаментом юстиции Актюбинской области 4 мая 2014 года № 3877. Утратило силу решением маслихата Алгинского района Актюбинской области от 12 февраля 2016 года № 258
title:
  rus: Об утверждении предельных размеров социальной помощи, предоставляемой отдельным категориям нуждающихся граждан, при наступлении трудной жизненной ситуации и об установлении размера социальной помощи участникам и инвалидам Великой Отечественной войны в Алгинском районе
  kaz: Алға ауданында мұқтаж азаматтардың жекелеген санаттарына өмірлік қиын жағдай туындаған кезде көрсететін әлеуметтік көмектің шекті мөлшерін бекіту және Ұлы Отан соғысының қатысушылары мен мүгедектеріне әлеуметтік көмектің көлемін белгілеу туралы
