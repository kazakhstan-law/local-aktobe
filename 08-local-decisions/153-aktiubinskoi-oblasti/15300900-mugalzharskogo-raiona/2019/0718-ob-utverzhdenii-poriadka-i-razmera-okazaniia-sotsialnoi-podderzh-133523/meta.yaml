act_code: '133523'
requisite: Решение Мугалжарского районного маслихата Актюбинской области от 18 июля 2019 года № 334. Зарегистрировано Департаментом юстиции Актюбинской области 22 июля 2019 года № 6289. Утратило силу решением Мугалжарского районного маслихата Актюбинской области от 22 июня 2020 года № 462
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Мугалжарского района
  kaz: Мұғалжар ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
