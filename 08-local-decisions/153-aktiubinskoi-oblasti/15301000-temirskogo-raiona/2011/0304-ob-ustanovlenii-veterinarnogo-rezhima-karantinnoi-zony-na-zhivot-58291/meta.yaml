requisite: Решение акима Бородиновского сельского округа Темирского района Актюбинской области от 4 марта 2011 года за № 1. Зарегистрировано Управлением юстиции Темирского района Актюбинской области 8 апреля 2011 года за № 3-10-144. Утратило силу решением акима Бородиновского сельского округа Темирского района Актюбинской области от 24 марта 2011 года № 2
title:
  rus: Об установлении ветеринарного режима карантинной зоны на животноводческой базе "Игибай" Бородиновского сельского округа по эмфизематозному карбункулу крупного рогатого скота
