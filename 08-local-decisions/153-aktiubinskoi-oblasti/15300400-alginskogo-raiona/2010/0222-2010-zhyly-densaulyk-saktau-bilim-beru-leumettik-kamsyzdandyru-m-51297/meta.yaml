requisite: Ақтөбе облысы Алға аудандық мәслихатының 2010 жылғы 22 ақпандағы № 3 шешімі. Ақтөбе облысының Алға аудандық Әділет басқармасында 2010 жылдың 16 наурызда № 3-3-103 тіркелді. Күші жойылды - Ақтөбе облысы Алға аудандық мәслихатының 2010 жылғы 23 желтоқсандағы № 4 шешімімен
title:
