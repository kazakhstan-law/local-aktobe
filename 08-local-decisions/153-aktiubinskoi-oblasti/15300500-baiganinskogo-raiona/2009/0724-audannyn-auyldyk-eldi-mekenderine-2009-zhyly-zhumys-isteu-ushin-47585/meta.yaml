act_code: '47585'
requisite: Ақтөбе облысы Байғанин аудандық мәслихатының 2009 жылғы 24 шілдедегі № 100 шешімі. Ақтөбе облысының Байғанин аудандық әділет басқармасында 2009 жылдың 27 тамызда N 3-4-82 тіркелді. Күші жойылды - Ақтөбе облысы Байғанин аудандық мәслихатының 2010 жылғы 5 ақпандағы № 127 шешімімен
title:
