requisite: Решение маслихата Мартукского района Актюбинской области от 10 июня 2015 года № 179. Зарегистрировано Департаментом юстиции Актюбинской области 07 июля 2015 года № 4414. Срок действия решения - до 1 января 2016 года
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мартукского района на 2015 год
  kaz: Мәртөк ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылға әлеуметтік қолдау шараларын ұсыну туралы
