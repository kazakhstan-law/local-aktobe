title:
  rus: Об отмене решения Алгинского районного маслихата от 31 октября 2025 года № 327 «О понижении размера ставки налогов при применении специального налогового режима на основе упрощенной декларации в Алгинском районе»
  kaz: Алға аудандық мәслихатының 2025 жылғы 31 қазандағы № 327 «Алға ауданында оңайлатылған декларация негізінде арнаулы салық режимін қолдану кезінде салық мөлшерлемесінің мөлшерін төмендету туралы» шешімін жою туралы
