  title:
    rus: О внесении изменений в решение Айтекебийского районного маслихата от 13 июня 2024 года № 225 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Айтекебийском районе»
    kaz: Әйтеке би аудандық мәслихатының 2024 жылғы 13 маусымдағы № 225 «Әйтеке би ауданында әлеуметтік көмек көрсетудің, мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
