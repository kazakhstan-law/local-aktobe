requisite: Решение Хромтауского районного маслихата Актюбинской области от 4 января 2019 года № 278. Зарегистрировано Управлением юстиции Хромтауского района Департамента юстиции Актюбинской области 8 января 2019 года № 3-12-200. Утратило силу - решением Хромтауского районного маслихата Актюбинской области от 22 мая 2019 года № 320
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Хромтауского района
  kaz: Хромтау ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
