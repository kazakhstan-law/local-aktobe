act_code: '186235'
requisite: Решение Иргизского районного маслихата Актюбинской области от 15 сентября 2023 года № 55
title:
  rus: Об оказании социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Иргизского района на 2023 год
  kaz: Ырғыз ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2023 жылға әлеуметтік қолдау көрсету туралы
