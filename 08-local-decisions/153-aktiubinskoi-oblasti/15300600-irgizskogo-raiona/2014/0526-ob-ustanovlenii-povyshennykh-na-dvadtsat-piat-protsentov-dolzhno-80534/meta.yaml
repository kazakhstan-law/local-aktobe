  title:
    rus: О внесении изменений в решение районного маслихата от 26 мая 2014 года № 142 "Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимися гражданскими служащими и работающими в сельской местности по Иргизскому району"
    kaz: '"Ырғыз ауданы бойынша азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарына жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік ставкаларды белгілеу туралы" 2014 жылғы 26 мамырдағы № 142 аудандық мәслихаттың шешіміне өзгерістер енгізу туралы'
