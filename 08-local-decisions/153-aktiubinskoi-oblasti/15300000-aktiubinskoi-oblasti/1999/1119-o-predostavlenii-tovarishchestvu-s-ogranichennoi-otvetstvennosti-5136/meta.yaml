title:
  rus: О предоставлении товариществу с ограниченной ответственностью «Казахтуркмунай» права временного пользования земельными участками для доразведки углеводородного сырья на нефтяном месторождении «Каратобе-Южное» в Байганинском районе
  kaz: Байғанин ауданында орналасқан «Қаратөбе-Южное» кен орнынан көмірсутегі шикізатын ары қарай іздестіру «Қазақтүрікмұнай» жауапкершілігі шектеулі серіктестігіне жер учаскелерін уақытша пайдалануға рұқсат беру туралы
