    kaz: Байғанин аудандық мәслихатының 2023 жылғы 14 қыркүйектегі № 54 «Байғанин ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
