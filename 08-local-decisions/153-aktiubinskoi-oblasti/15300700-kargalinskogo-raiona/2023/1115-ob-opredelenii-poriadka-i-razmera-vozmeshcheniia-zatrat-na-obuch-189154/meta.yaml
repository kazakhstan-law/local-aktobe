    kaz: Қарғалы аудандық мәслихатының 2023 жылғы 15 қарашадағы № 92 «Қарғалы ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
