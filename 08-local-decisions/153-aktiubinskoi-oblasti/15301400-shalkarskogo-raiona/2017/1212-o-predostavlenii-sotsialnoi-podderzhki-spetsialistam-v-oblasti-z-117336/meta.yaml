requisite: Решение Шалкарского районного маслихата Актюбинской области от 12 декабря 2017 года № 152. Зарегистрировано Департаментом юстиции Актюбинской области 26 декабря 2017 года № 5768
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шалкарского района на 2018 год
  kaz: Шалқар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылға әлеуметтік қолдау көрсету туралы
