requisite: Решение Хромтауского районного маслихата Актюбинской области от 21 декабря 2012 года № 82. Зарегистрировано Департаментом юстиции Актюбинской области 10 января 2013 года № 3488. Утратило силу решением маслихата Хромтауского района Актюбинской области от 25 апреля 2016 года № 18
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына жиырма бес пайызға жоғары айлықақылар мен тарифтік ставкалар белгілеу туралы
