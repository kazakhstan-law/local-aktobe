act_code: '50567'
requisite: Ақтөбе облысы Шалқар аудандық әкімінің 2010 жылғы 10 қаңтардағы № 1 шешімі. Ақтөбе облысының Шалқар аудандық әділет басқармасында 2010 жылдың 10 ақпанда № 3-13-120 тіркелді. Күші жойылды - Ақтөбе облысы Шалқар аудандық әкімінің 2010 жылғы 3 шілдедегі № 8 шешімімен
