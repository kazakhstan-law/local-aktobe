requisite: Ақтөбе облысы Қобда аудандық мәслихатының 2010 жылғы 28 қыркүйектегі № 154 шешімі. Ақтөбе облысы Қобда ауданының Әділет басқармасында 2010 жылғы 27 қазанда № 3-7-96 тіркелді. Қолданылу мерзімінің аяқталуына байланысты күші жойылды - (Ақтөбе облысы Қобда аудандық мәслихатының 2013 жылғы 5 сәуірдегі № 5-05/44 хатымен)
title:
  rus: Қобда ауданының тұрғындарына коммуналдық қызметтерді тұтынғаны үшін және телефонға абоненттік ақы тарифтерінің өсуіне байланысты шығындарды өтеуге арналған тұрғын үй көмегін беру Ережесін бекіту туралы
