requisite: Ақтөбе облысы Ырғыз аудандық әкімінің 2009 жылғы 9 желтоқсандағы N 8 шешімі. Ақтөбе облысының Ырғыз аудандық Әділет басқармасында 2010 жылдың 5 қаңтарда N 3-5-111 тіркелді. Күші жойылды - Ақтөбе облысы Ойыл аудандық әкімінің 2010 жылғы 24 қарашадағы № 9 шешімімен
