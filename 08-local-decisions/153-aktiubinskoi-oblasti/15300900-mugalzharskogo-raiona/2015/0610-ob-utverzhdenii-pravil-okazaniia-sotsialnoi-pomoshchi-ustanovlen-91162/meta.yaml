    kaz: «Мұғалжар ауданында әлеуметтік көмек көрсету, мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» Мұғалжар аудандық мәслихатының 2015 жылғы 10 маусымдағы № 234 шешіміне өзгерістер мен толықтырулар енгізу туралы
