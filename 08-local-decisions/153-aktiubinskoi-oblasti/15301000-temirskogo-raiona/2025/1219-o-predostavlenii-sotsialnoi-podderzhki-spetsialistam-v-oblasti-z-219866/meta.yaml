act_code: '219866'
requisite: Решение Темирского районного маслихата Актюбинской области от 19 декабря 2025 года № 389
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов  сельских округов, прибывшим для работы и проживания в сельские населенные пункты Темирского района на 2026 год
  kaz: Темір ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2026 жылға әлеуметтік қолдау көрсету туралы
