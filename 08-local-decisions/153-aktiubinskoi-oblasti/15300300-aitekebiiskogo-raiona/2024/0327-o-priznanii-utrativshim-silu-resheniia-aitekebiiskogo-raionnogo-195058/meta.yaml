act_code: '195058'
requisite: Решение Айтекебийского районного маслихата Актюбинской области от 27 марта 2024 года № 180. Зарегистрировано Департаментом юстиции Актюбинской области 29 марта 2024 года № 8546-04
title:
  rus: О признании утратившим силу решения Айтекебийского районного маслихата от 9 февраля 2024 года № 172 «Об оказании дополнительной социальной помощи отдельным категориям нуждающихся граждан Айтекебийского района к 35 – летию вывода ограниченного контингента советских войск из Демократической Республики Афганистан»
  kaz: Әйтеке би аудандық мәслихатының 2024 жылғы 9 ақпандағы № 172 «Ауғанстан Демократиялық Республикасынан Кеңес әскерлерінің шектеулі контингентін шығаруының 35-жылдығына орай Әйтеке би ауданының мұқтаж азаматтарының санаттарына қосымша әлеуметтік көмек көрсету туралы» шешімінің күшін жою туралы
