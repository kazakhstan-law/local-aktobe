    kaz: Мұғалжар аудандық мәслихатының 2016 жылғы 12 сәуірдегі № 14 «Мұғалжар ауданында әлеуметтік көмек көрсету, мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
