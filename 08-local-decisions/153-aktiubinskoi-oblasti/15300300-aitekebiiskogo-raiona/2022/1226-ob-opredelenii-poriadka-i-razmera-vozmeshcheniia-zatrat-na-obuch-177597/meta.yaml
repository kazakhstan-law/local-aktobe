  title:
    rus: О внесении изменений в решение Айтекебийского районного маслихата от 26 декабря 2022 года № 291 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Айтекебийском районе»
    kaz: Әйтеке би аудандық мәслихатының 2022 жылғы 26 желтоқсандағы № 291 «Әйтеке би ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
