act_code: '137920'
requisite: Решение Байганинского районного маслихата Актюбинской области от 30 декабря 2019 года № 295. Зарегистрировано Департаментом юстиции Актюбинской области 5 января 2020 года № 6644
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Байганинского района на 2020 год
  kaz: Байғанин ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылға әлеуметтік қолдау көрсету туралы
