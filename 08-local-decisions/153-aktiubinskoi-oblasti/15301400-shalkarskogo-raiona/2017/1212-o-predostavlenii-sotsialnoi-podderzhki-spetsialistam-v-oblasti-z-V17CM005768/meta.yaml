  title:
    rus: О внесении изменений в решение Шалкарского районного маслихата от 12 декабря 2017 года № 152 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шалкарского района на 2018 год»
    kaz: Шалқар аудандық мәслихатының 2017 жылғы 12 желтоқсандағы № 152 «Шалқар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылға әлеуметтік қолдау көрсету туралы» шешіміне өзгерістер енгізу туралы
