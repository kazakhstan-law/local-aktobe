title:
  rus: Об установлении стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Центр оказания содействия по обеспечению и мониторингу жилищного фонда» государственного учреждения «Отдел жилищных отношений города Актобе», финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын «Ақтөбе қаласының тұрғын үй қатынастары бөлімі» мемлекеттік мекемесінің «Тұрғын үй қорын қамтамасыз ету және мониторинг жүргізу бойынша орталық» коммуналдық мемлекеттік мекемесі қызметкерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу туралы
