requisite: Решение Мугалжарского районного маслихата Актюбинской области от 18 июля 2019 года № 336. Зарегистрировано Департаментом юстиции Актюбинской области 25 июля 2019 года № 6296. Утратило силу решением Мугалжарского районного маслихата Актюбинской области от 8 сентября 2023 года № 89
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Мугалжарскому району
  kaz: Мұғалжар ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
