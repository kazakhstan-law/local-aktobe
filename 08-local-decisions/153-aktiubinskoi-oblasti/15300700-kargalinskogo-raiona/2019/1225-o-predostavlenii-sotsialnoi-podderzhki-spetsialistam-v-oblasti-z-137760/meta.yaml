act_code: '137760'
requisite: Решение Каргалинского районного маслихата Актюбинской области от 25 декабря 2019 года № 397. Зарегистрировано Департаментом юстиции Актюбинской области 27 декабря 2019 года № 6639
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Каргалинского района на 2020 год
  kaz: Қарғалы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылға әлеуметтік қолдау көрсету туралы
