act_code: '139759'
requisite: Решение Айтекебийского районного маслихата Актюбинской области от 17 февраля 2020 года № 371. Зарегистрировано Департаментом юстиции Актюбинской области 21 февраля 2020 года № 6824
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Айтекебийского района на 2020 год
  kaz: 2020 жылға арналған Әйтеке би ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы
