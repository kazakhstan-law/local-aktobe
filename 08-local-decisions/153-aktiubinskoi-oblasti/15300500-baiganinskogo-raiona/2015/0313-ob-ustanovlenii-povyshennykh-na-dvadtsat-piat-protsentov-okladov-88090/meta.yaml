  title:
    rus: О внесении изменений в решение Байганинского районного маслихата  от 13 марта 2015 года № 160 «Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах»
    kaz: Байғанин аудандық мәслихатының 2015 жылғы 13 наурыздағы № 160 «Азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/140477/rus
