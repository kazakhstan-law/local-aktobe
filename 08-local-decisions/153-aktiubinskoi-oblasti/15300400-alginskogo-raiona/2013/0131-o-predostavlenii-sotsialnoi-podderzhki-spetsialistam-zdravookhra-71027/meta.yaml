requisite: Решение Алгинского районного маслихата Актюбинской области от 31 января 2013 года № 69. Зарегистрировано Департаментом юстиции Актюбинской области 15 февраля 2013 года № 3530. Утратило силу в связи с истечением срока применения - (письмо маслихата Алгинского района Актюбинской области от 27 февраля 2014 года № 02-6/25)
title:
  rus: О предоставлении социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные пункты района в 2013 году
  kaz: Ауданның ауылдық елді мекендеріне 2013 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау көрсету туралы
