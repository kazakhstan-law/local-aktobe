requisite: Решение маслихата Темирского района Актюбинской области от 10 мая 2012 года № 41. Зарегистрировано Департаментом юстиции Актюбинской области 31 мая 2012 года № 3-10-170. Утратило силу решением маслихата Темирского района Актюбинской области от 28 января 2013 года № 84
title:
  rus: Об оказании социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Темирского района
  kaz: Темір ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау көрсету туралы
