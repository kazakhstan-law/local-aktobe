act_code: '42055'
requisite: Ақтөбе облысы Шалқар аудандық мәслихатының 2008 жылғы 16 қазандағы N 79 шешімі. Ақтөбе облысының Шалқар аудандық әділет басқармасында 2008 жылдың 30 қазанда N 3-13-87 тіркелді. Күші жойылды - Ақтөбе облысы Шалқар аудандық мәслихатының 2010 жылғы 20 сәуірдегі № 203 шешімімен
title:
  rus: Шалқар ауданы аймағындағы ауылдық жерлерде тұратын және жұмыс істейтін денсаулық сақтау, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек мөлшерін белгілеу туралы
