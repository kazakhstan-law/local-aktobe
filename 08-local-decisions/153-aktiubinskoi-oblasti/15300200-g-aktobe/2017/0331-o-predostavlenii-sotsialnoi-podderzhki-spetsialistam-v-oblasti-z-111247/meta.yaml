act_code: '111247'
requisite: Решение маслихата города Актобе Актюбинской области от 31 марта 2017 года № 173. Зарегистрировано Департаментом юстиции Актюбинской области 11 апреля 2017 года № 5423
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Актобе на 2017 год
  kaz: Ақтөбе қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2017 жылға әлеуметтік қолдау көрсету туралы
