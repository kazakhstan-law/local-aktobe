requisite: Решение маслихата Иргизского района Актюбинской области от 8 ноября 2013 года № 98. Зарегистрировано Департаментом юстиции Актюбинской области 15 ноября 2013 года № 3670. Утратило силу решением маслихата Иргизского района Актюбинской области от 7 декабря 2018 года № 181
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Иргизского района
  kaz: Ырғыз ауданының ауылдық елдi мекендерде тұратын және жұмыс істейтiн мемлекеттiк денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшiн әлеуметтік көмек беру туралы
