  title:
    rus: О внесении изменений в решение Актюбинского областного маслихата от 17 мая 2021 года № 39 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан при амбулаторном лечении бесплатно»
    kaz: Ақтөбе облыстық мәслихаттың 2021 жылғы 17 мамырдағы № 39 «Қазақстан Республикасы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін шарттармен тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша беру туралы» шешіміне өзгерістер енгізу туралы
