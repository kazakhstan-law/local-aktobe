title:
  rus: О признании утратившим силу решения Каргалинского районного маслихата от 13 марта 2024 года № 136 «О понижении размера ставки налогов при применении специального налогового режима розничного налога в Каргалинском районе»
  kaz: Қарғалы аудандық мәслихатының 2024 жылғы 13 наурыздағы № 136 «Қарғалы ауданында бөлшек салықтың арнайы салық режимін қолдану кезінде салық мөлшерлемесін төмендету туралы» шешімінің күшін жою туралы
