requisite: Ақтөбе облысы Темір аудандық мәслихатының 2009 жылғы 23 сәуірдегі № 113 шешімі. Ақтөбе облысының Темір аудандық әділет басқармасында 2009 жылдың 5 мамырда № 3-10-110 тіркелді. Күші жойылды - Ақтөбе облысы Темір аудандық мәслихатының 2009 жылғы 24 желтоқсандағы № 146 шешімімен
