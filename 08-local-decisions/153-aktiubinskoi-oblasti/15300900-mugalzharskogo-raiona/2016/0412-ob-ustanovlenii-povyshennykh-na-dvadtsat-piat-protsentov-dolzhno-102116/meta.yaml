  title:
    rus: О внесении дополнения в решение Мугалжарского районного маслихата от 12 апреля 2016 года № 13 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности по Мугалжарскому району»
    kaz: Мұғалжар аудандық мәслихатының 2016 жылғы 12 сәуірдегі № 13 «Мұғалжар ауданы бойынша азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы» шешіміне толықтыру енгізу туралы
