act_code: '77830'
requisite: Решение маслихата Темирского района Актюбинской области от 19 февраля 2014 года № 170. Зарегистрировано Департаментом юстиции Актюбинской области 06 марта 2014 года № 3791. Утратило силу решением маслихата Темирского района Актюбинской области от 23 декабря 2014 года № 222
title:
  rus: О предоставлении подъемного пособия и социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Темирского района на 2014 год
  kaz: 2014 жылға арналған Темір ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы мен әлеуметтік қолдауды көрсету туралы
