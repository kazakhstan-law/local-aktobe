requisite: Ақтөбе облысы Ырғыз аудандық мәслихатының 2008 жылғы 4 мамырдағы N 32 шешімі. Ақтөбе облысының Ырғыз аудандық Әділет басқармасыда 2008 жылдың 7 мамырдағы N 3-5-73 тіркелді. Күші жойылды - Ақтөбе облысы Ырғыз аудандық мәслихатының 2011 жылғы 25 сәуірдегі № 176 шешімімен
