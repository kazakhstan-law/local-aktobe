  title:
    rus: О внесении изменений в решение районного маслихата от 17 апреля 2014 года № 151 «Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, культуры, спорта и ветеринарии, работающим в сельских населенных пунктах Алгинского района»
    kaz: «Алға ауданының ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласының мамандарына жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік ставкаларды белгілеу туралы» 2014 жылғы 17 сәуірдегі № 151 аудандық мәслихаттың шешіміне өзгерістер енгізу туралы
