act_code: '119923'
requisite: Решение маслихата Кобдинского района Актюбинской области от 2 марта 2018 года № 135. Зарегистрировано Управлением юстиции Кобдинского района Актюбинской области 26 марта 2018 года № 3-7-155
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Кобдинского района на 2018 год
  kaz: Қобда ауданының ауылдық елді мекендеріне жұмыс істеуге және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылға әлеуметтік қолдау көрсету туралы
