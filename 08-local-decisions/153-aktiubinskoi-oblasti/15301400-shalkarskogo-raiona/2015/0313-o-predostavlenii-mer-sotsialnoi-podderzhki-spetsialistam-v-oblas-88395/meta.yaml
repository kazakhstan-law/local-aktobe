act_code: '88395'
requisite: Решение маслихата Шалкарского района Актюбинской области от 13 марта 2015 года № 200. Зарегистрировано Департаментом юстиции Актюбинской области 3 апреля 2015 года № 4281. Утратило силу решением маслихата Шалкарского района Актюбинской области от 25 декабря 2015 года № 262
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шалкарского района на 2015 год
  kaz: Шалқар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылға әлеуметтік қолдау шараларын ұсыну туралы
