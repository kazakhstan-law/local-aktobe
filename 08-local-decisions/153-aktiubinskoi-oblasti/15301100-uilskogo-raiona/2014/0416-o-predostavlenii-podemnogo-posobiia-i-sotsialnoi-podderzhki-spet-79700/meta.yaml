requisite: Решение маслихата Уилского района Актюбинской области от 16 апреля 2014 года № 167. Зарегистрировано Департаментом юстиции Актюбинской области 12 мая 2014 года № 3898. Утратило силу в связи с истечением срока применения (письмо Уилского районного маслихата Актюбинской области от 3 февраля 2015 года № 19)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в Уилский район на 2014 год
  kaz: 2014 жылға Ойыл ауданына жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау және көтерме жәрдемақы ұсыну туралы
