  title:
    rus: О внесении изменеия в решение Байганинского районного маслихата от 19 мая 2023 года № 21 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Байганинского района на 2023 год»
    kaz: Байғанин аудандық мәслихатының 2023 жылғы 19 мамырдағы № 21 «Байғанин ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне  2023 жылға әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
