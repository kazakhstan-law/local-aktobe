  title:
    rus: О внесении изменений в решение Кобдинского районного маслихата от 25 декабря 2019 года № 272 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Кобдинского района на 2020 год»
    kaz: Қобда аудандық мәслихатының 2019 жылғы 25 желтоқсандағы № 272 «Қобда ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылға әлеуметтік қолдау көрсету туралы» шешіміне өзгерістер енгізу туралы
