  title:
    rus: О признании утратившим силу решения Актюбинского областного маслихата от 8 июня 2022 года № 140 «Об утверждении размера платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения в Актюбинской области»
    kaz: «Ақтөбе облысында ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін бекіту туралы» Ақтөбе облыстық мәслихаттың 2022 жылғы 8 маусымдағы № 140 шешімінің күші жойылды деп тану туралы
