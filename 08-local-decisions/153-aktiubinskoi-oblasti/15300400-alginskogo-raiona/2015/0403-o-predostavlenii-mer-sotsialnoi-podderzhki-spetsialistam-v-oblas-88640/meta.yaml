  title:
    rus: О внесении изменений в решение районного маслихата от 3 апреля 2015 года № 199 "Об определении мер социальной поддержки специалистам в области здровоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Алгинского района в 2015 году
    kaz: Аудандық мәслихаттың "Алға ауданының ауылдық елді мекендеріне 2015 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын айқындау туралы" 2015 жылғы 3 сәуірдегі № 199 шешіміне өзгерістер енгізу туралы
