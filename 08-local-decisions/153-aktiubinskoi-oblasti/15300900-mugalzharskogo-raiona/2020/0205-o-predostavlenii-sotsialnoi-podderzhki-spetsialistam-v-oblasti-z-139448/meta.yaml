  title:
    rus: О внесении изменений в решение Мугалжарского районного маслихата от 5 февраля 2020 года № 405 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мугалжарского района на 2020 год»
    kaz: Мұғалжар аудандық мәслихатының 2020 жылғы 5 ақпандағы № 405 «Мұғалжар ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылға әлеуметтік қолдау көрсету туралы» шешіміне өзгерістер енгізу туралы
