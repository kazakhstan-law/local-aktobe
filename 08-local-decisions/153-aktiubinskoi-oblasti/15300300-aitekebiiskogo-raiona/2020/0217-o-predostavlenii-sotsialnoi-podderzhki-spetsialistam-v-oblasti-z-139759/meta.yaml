  title:
    rus: О внесении изменений в решение районного маслихата от 17 февраля 2020 года № 371 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Айтекебийского района на 2020 год»
    kaz: Аудандық мәслихатының 2020 жылғы 17 ақпандағы № 371 «2020 жылға арналған Әйтеке би ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы» шешіміне өзгерістер енгізу туралы
