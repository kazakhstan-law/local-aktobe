  title:
    rus: О внесении изменений в решение Алгинского районного маслихата от 13 марта 2020 года № 346 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Алгинского района на 2020 год»
    kaz: Алға аудандық мәслихатының 2020 жылғы 13 наурыздағы № 346 «2020 жылға арналған Алға ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы» шешіміне өзгерістер енгізу туралы
