requisite: Ақтөбе облысы Мәртөк аудандық мәслихатының 2009 жылғы 24 шілдедегі N 128 шешімі. Ақтөбе облысы Мәртөк аудандық әділет басқармасында 2009 жылғы 18 тамызда N 3-8-96 тіркелді. Күші жойылды - Ақтөбе облысы Мәртөк аудандық мәслихатының 2012 жылғы 25 қазандағы № 43 шешімімен
