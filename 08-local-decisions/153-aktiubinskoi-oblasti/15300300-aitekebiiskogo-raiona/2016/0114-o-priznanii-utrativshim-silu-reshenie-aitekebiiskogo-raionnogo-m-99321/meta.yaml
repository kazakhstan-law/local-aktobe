requisite: Решение маслихата Айтекебийского района Актюбинской области от 14 января 2016 года № 294
title:
  rus: О признании утратившим силу решение Айтекебийского районного маслихата от 10 ноября 2015 года № 262 «О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые земли сельскохозяйственного назначения в Айтекебийском районе»
  kaz: Әйтеке би аудандық мәслихатының 2015 жылғы 10 қарашадағы «Пайдаланылмайтын ауылшаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы» № 262 шешімінің күшін жою туралы
