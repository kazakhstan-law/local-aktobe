  title:
    rus: О внесении изменений в решение очередной третьей сессии маслихата города Актобе от 19 декабря 2007 года N 28 "Об утверждении Правил благоустройства, санитарной очистки, организации уборки и обеспечения чистоты на территории города Актобе"
    kaz: '"Ақтөбе қаласының аумағын көркейту, санитарлық тазалау, тазалық сақтау және жинауды ұйымдастыру Қағидасын бекіту туралы" Ақтөбе қалалық мәслихатының 2007 жылғы 19 желтоқсандағы кезекті үшінші сессиясының N 28 шешіміне өзгерістер енгізу туралы'
