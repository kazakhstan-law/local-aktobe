  title:
    rus: О внесении изменений в решение Айтекебийского районного маслихата «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности по Айтекебийскому району» от 2 октября 2019 года под № 319
    kaz: «Әйтеке би ауданы бойынша азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» Әйтеке би аудандық мәслихаттың 2019 жылғы 2 қазандағы № 319 шешіміне өзгерістер енгізу туралы
