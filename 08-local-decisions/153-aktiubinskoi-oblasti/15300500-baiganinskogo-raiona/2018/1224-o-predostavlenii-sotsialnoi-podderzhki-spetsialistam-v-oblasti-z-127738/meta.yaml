act_code: '127738'
requisite: Решение Байганинского районного маслихата Актюбинской области от 24 декабря 2018 года № 194. Зарегистрировано Управлением юстиции Байганинского района Департамента юстиции Актюбинской области 26 декабря 2018 года № 3-4-196
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Байганинского района на 2019 год
  kaz: Байғанин ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылға әлеуметтік қолдау көрсету туралы
