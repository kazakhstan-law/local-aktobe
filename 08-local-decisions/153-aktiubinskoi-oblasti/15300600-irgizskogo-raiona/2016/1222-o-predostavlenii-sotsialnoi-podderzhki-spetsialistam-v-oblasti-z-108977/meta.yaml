requisite: Решение маслихата Иргизского района Актюбинской области от 22 декабря 2016 года № 59. Зарегистрировано Департаментом юстиции Актюбинской области 11 января 2017 года № 5214
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Иргизского района на 2017 год
  kaz: Ырғыз ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2017 жылға әлеуметтік қолдау көрсету туралы
