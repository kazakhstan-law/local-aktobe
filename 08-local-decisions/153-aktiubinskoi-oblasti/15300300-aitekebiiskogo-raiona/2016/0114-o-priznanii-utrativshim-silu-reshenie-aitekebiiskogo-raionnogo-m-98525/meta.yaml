act_code: '98525'
requisite: Решение маслихата Айтекебийского района Актюбинской области от 14 января 2016 года № 289
title:
  rus: О признании утратившим силу решение Айтекебийского районного маслихата от 24 февраля 2015 года № 138 "Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Айтекебийском районе"
  kaz: Әйтеке би аудандық мәслихатының 2014 жылғы 24 ақпандағы "Әйтеке би ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы" № 138 шешімінің күшін жою туралы
