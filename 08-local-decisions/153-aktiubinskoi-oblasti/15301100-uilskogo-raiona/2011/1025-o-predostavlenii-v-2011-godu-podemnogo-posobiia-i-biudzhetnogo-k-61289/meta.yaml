requisite: Решение маслихата Уилского района Актюбинской области от 25 октября 2011 года № 296. Зарегистрировано Департаментом юстиции Актюбинской области 15 ноября 2011 года № 3-11-101. Утратило силу в связи с истечением срока действия - письмо маслихата Уилского района Актюбинской области от 30 марта 2012 года № 27
title:
