  title:
    rus: О внесении изменения в решение районного маслихата от 27 мая 2014 года № 161 «Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности по Шалкарскому району»
    kaz: «Шалқар ауданы бойынша азаматтық қызметші болып табылатын және ауылдық жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік ставкаларды белгілеу туралы» 2014 жылғы 27 мамырдағы № 161 аудандық мәслихаттың шешіміне өзгеріс енгізу туралы
