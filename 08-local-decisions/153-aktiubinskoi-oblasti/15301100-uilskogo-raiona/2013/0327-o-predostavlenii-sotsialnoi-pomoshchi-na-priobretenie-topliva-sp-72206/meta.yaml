requisite: Решение маслихата Уилского района Актюбинской области от 27 марта 2013 года № 78. Зарегистрировано Департаментом юстиции Актюбинской области 24 апреля 2013 года № 3568. Утратило силу решением маслихата Уилского района Актюбинской области от 28 июня 2013 года № 101
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мемлекеттік ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
