  requisite: Решение очередной тридцать девятой сессии маслихата города Актобе Актюбинской области от 30 мая 2007 года № 345. Зарегистрировано Управлением юстиции города Актобе Актюбинской области 14 июня 2007 года № 3-1-73. Утратило силу решением маслихата города Актобе Актюбинской области от 25 мая 2018 года № 336
  title:
    rus: О внесении изменения и дополнения в решение N 263 очередной тридцать первой сессии маслихата города Актобе от 24 августа 2006 года "Об утверждении схемы зонирования земель города Актобе для установления границ ценовых зон и дифференциации базовых ставок платы за землю и базовых ставок земельного  налога в пределах границ, определенных Генеральным планом города Актобе"
    kaz: Ақтөбе қалалық мәслихатының кезекті отыз бірінші сессиясының 2006 жылғы 24 тамыздағы N 263 "Ақтөбе қаласы дамуының Бас жоспарымен анықталған шегінде жерге және жер салығына базалық ставкаларын дифференциациялау мен бағалау аймақтары шекараларын белгілеу үшін Ақтөбе қаласы жерлерін аймақтарға бөлу сызбасын бекіту туралы" шешіміне өзгерістер мен толықтырулар енгізу туралы
