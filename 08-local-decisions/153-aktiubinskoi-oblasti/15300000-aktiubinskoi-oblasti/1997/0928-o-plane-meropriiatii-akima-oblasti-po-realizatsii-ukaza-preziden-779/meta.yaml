requisite: Решение акима Актюбинской области от 29 сентября 1997 года № 185. Зарегистрировано Управлением юстиции Актюбинской области 24 ноября 1997 года № 1. Утратило силу в связи с истечением срока применения - письмом акимата Актюбинской области от 21 декабря 2004 года № 08-3/2691
title:
  rus: О плане мероприятий Акима области по реализации Указа Президента Республики Казахстан от 20 июля 1997 года № 3558 “О государственной программе Республики Казахстан по борьбе с преступностью на 1997-1998 годы и основным направлениям правоохранительной деятельности до 2000 года”
  kaz: Қазақстан Республикасы Президентінің 1997 жылғы 20 маусымдағы "Қазақстан Республикасының 1997-1998 жылдарға арналған қылмысқа қарсы күрес және 2000 жылға дейінгі құқық қорғау қызметінің негізгі бағыттары жөніндегі мемлекеттік бағдарламасы туралы" № 3558 Жарлығын жүзеге асыру жөніндегі шаралар туралы
