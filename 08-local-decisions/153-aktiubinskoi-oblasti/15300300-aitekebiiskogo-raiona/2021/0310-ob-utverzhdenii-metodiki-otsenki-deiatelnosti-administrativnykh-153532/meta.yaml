    kaz: Әйтеке би аудандық мәслихатының 2021 жылғы 10 наурыздағы № 11 «Әйтеке би аудандық мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың Әдістемесін бекіту туралы» шешіміне өзгерістер енгізу туралы
