  title:
    rus: О внесении изменения в решение Байганинского районного маслихата от 14 сентября 2023 года № 54 «Об утверждении Правил оказания социальной помощи, установления её размеров и определения перечня отдельных категорий нуждающихся граждан в Байганинском районе»
    kaz: Байғанин аудандық мәслихатының 2023 жылғы 14 қыркүйектегі № 54 «Байғанин ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
