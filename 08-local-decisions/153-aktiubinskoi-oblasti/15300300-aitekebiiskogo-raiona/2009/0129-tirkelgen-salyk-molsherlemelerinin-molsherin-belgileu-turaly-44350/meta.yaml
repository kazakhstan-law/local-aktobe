requisite: Ақтөбе облысы Әйтеке би аудандық мәслихатының 2009 жылғы 29 қаңтардағы N 98 шешімі. Ақтөбе облысының Әйтеке би аудандық әділет басқармасында 2009 жылдың 20 ақпанда N 3-2-70 тіркелді. Күші жойылды - Ақтөбе облысы Әйтеке би аудандық мәслихатының 2018 жылғы 2 наурыздағы N 193 шешімімен
