requisite: Ақтөбе облысы Мәртөк аудандық мәслихатының 2010 жылғы 5 ақпандағы N 152 шешімі. Ақтөбе облысының Мәртөк аудандық Әділет басқармасында 2010 жылдың 16 ақпандағы N 3-8-106 тіркелді. Күші жойылды - Ақтөбе облысы Мәртөк аудандық мәслихатының 2010 жылғы 24 желтоқсандағы № 200 шешімімен
