act_code: '127664'
requisite: Решение Шалкарского районного маслихата Актюбинской области от 24 декабря 2018 года № 293. Зарегистрировано Управлением юстиции Шалкарского района Департамента юстиции Актюбинской области 26 декабря 2018 года № 3-13-224
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шалкарского района на 2019 год
  kaz: Шалқар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылға әлеуметтік қолдау көрсету туралы
