  title:
    rus: О внесении изменения в решение Каргалинского районного маслихата от 29 декабря 2023 года № 123 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Каргалинском районе»
    kaz: Қарғалы аудандық мәслихатының 2023 жылғы 29 желтоқсандағы № 123 «Қарғалы ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
