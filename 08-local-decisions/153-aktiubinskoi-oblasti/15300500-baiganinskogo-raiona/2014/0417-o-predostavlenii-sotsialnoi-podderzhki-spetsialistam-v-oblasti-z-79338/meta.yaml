act_code: '79338'
requisite: Решение Байганинского районного маслихата Актюбинской области от 17 апреля 2014 года № 115. Зарегистрировано Департаментом юстиции Актюбинской области 30 апреля 2014 года № 3866. Утратило силу решением маслихата Байганинского района Актюбинской области от 07 июля 2016 года № 28
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Байганинского района на 2014 год
  kaz: Байғанин ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2014 жылға әлеуметтік қолдау көрсету туралы
