  title:
    rus: О внесении изменений и дополнения в решение областного маслихата от 11 декабря 2015 года № 349 «Об утверждении Правил содержания и защиты зеленых насаждений, Правил благоустройства территорий городов и населенных пунктов Актюбинской области»
    kaz: Облыстық мәслихаттың 2015 жылғы 11 желтоқсандағы № 349 «Ақтөбе облысының қалалары мен елді мекендерінің аумақтарында жасыл екпелерді күтіп-ұстаудың және қорғаудың Қағидаларын, абаттандырудың Қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
