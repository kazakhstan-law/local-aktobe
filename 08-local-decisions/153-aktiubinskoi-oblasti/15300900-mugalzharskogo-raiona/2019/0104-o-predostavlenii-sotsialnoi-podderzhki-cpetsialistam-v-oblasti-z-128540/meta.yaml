act_code: '128540'
requisite: Решение Мугалжарского районного маслихата Актюбинской области от 4 января 2019 года № 278. Зарегистрировано Управлением юстиции Мугалжарского района Департамента юстиции Актюбинской области 9 января 2019 года № 3-9-237
title:
  rus: О предоставлении социальной поддержки cпециалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Мугалжарского района на 2019 год
  kaz: Мұғалжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылға әлеуметтік қолдау көрсету туралы
