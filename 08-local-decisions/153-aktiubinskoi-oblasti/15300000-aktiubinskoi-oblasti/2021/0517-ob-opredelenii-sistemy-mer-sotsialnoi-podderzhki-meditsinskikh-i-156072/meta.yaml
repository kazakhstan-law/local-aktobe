requisite: Решение маслихата Актюбинской области от 17 мая 2021 года № 37. Зарегистрировано Департаментом юстиции Актюбинской области 21 мая 2021 года № 8303
title:
  rus: Об определении системы мер социальной поддержки медицинских и фармацевтических работников, направленных для работы в сельскую местность и поселки, города районного значения Актюбинской области, а также порядок и размер оказания им социальной поддержки за счет бюджетных средств
  kaz: Ақтөбе облысының ауылдық жеріне және кенттеріне, аудандық маңызы бар қалаларына жұмысқа жіберілген медицина және фармацевтика қызметкерлерін  әлеуметтік қолдау шараларының жүйесін, сондай-ақ оларға бюджет қаражаты есебінен әлеуметтік қолдау көрсету тәртібі мен мөлшерін айқындау туралы
