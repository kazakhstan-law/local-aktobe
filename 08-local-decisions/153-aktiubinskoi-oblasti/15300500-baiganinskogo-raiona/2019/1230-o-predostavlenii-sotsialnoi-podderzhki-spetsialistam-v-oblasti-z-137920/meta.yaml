  title:
    rus: О внесении изменений в решение Байганинского районного маслихата от 30 декабря 2019 года № 295 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Байганинского района на 2020 год»
    kaz: Байғанин аудандық мәслихатының 2019 жылғы 30 желтоқсандағы № 295 «Байғанин ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2020 жылға әлеуметтік қолдау көрсету туралы» шешіміне өзгерістер енгізу туралы
