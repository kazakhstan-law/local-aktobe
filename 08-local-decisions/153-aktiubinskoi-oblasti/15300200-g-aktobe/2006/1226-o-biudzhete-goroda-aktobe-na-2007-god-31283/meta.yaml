act_code: '31283'
requisite: Решение очередной тридцать пятой сессии Маслихата города Актобе Актюбинской области от 26 декабря 2006 года N 284. Зарегистрировано в Управлении юстиции города Актобе Актюбинской области 9 января 2007 года за N 3-1-63. Утратило силу в связи с истечением срока действия - письмом управления юстиции города Актобе Актюбинской области от 10 января 2008 года N 1-06/82
