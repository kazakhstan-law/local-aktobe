  title:
    rus: О внесении изменения в решение Айтекебийского районного маслихата от 26 декабря 2022 года № 292 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Айтекебийского района на 2023 год»
    kaz: Әйтеке би аудандық мәслихатының 2022 жылғы 26 желтоқсандағы № 292 «2023 жылға арналған Әйтеке би ауданының ауылдық елді мекендерге жұмыс істеуге және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/188463/rus
