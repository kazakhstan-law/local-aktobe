  title:
    rus: О внесении изменений в решение Алгинского районного маслихата от 27 февраля 2019 года № 237 «Об определении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Алгинского района на 2019 год»
    kaz: Алға аудандық мәслихатының 2019 жылғы 27 ақпандағы № 237 «2019 жылға арналған Алға ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
