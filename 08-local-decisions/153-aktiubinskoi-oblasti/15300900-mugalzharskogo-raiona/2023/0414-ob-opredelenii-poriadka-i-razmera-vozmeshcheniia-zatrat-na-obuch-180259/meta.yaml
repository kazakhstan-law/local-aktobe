  title:
    rus: О внесении изменений в решение Мугалжарского районного маслихата от 14 апреля 2023 года № 12 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Мугалжарском районе»
    kaz: Мұғалжар аудандық мәслихатының 2023 жылғы 14 сәуірдегі № 12 «Мұғалжар ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
