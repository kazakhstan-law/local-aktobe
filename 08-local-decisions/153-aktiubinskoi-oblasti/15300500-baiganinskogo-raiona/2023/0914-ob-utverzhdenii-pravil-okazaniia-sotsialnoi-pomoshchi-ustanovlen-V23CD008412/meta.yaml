  title:
    rus: О внесении изменения в решение Байганинского районного маслихата от 14 сентября 2023 года № 54 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Байганинском районе»
