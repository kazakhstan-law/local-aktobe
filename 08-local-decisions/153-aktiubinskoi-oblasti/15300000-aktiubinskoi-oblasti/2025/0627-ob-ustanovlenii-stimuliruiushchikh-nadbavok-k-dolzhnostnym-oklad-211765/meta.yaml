  kaz: Жергілікті бюджеттен қаржыландырылатын «Ақтөбе облысының табиғи ресурстар және табиғатты пайдалануды реттеу басқармасы» мемлекеттік мекемесіне ведомстволық бағынысты коммуналдық мемлекеттік мекемелерінің қызметкерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу туралы
