requisite: Ақтөбе облысы Байғанин ауданы Жарқамыс селолық округі әкімінің 2010 жылғы 20 қыркүйектегі № 11 шешімі. Ақтөбе облысының Байғанин аудандық Әділет басқармасында 2010 жылғы 19 қазанда № 3-4-104 тіркелді. Күші жойылды - Ақтөбе облысы Байғанин ауданы Жарқамыс селолық округі әкімінің 2010 жылғы 22 қарашадағы № 13 шешімімен
