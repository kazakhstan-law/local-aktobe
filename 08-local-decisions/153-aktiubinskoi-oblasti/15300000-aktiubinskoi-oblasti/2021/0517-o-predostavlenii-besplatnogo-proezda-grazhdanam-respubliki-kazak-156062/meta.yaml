act_code: '156062'
requisite: Решение маслихата Актюбинской области от 17 мая 2021 года № 38. Зарегистрировано Департаментом юстиции Актюбинской области 21 мая 2021 года № 8299
title:
  rus: О предоставлении бесплатного проезда гражданам Республики Казахстан, проживающим в Актюбинской области, за пределы населенного пункта постоянного проживания для получения высокотехнологичных медицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде жоғары технологиялық медициналық көрсетілетін қызметтерді және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмекті алу үшін Ақтөбе облысында тұратын Қазақстан Республикасының азаматтарына тұрақты тұратын елді мекеннен тысқары жерлерге тегін жол жүруді ұсыну туралы
