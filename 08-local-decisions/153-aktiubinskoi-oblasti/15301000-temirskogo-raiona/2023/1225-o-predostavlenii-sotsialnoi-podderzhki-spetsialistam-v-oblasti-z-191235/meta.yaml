  requisite: Решение Темирского районного маслихата Актюбинской области от 10 сентября 2024 года № 236
  title:
    rus: О внесении изменения в решение Темирского районного маслихата от 25 декабря 2023 года № 134 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Темирского района на 2024 год»
    kaz: Темір аудандық мәслихатының 2023 жылғы 25 желтоқсандағы № 134 «Темір ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылға әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/200795/rus
