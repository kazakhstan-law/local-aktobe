act_code: '102395'
requisite: Решение маслихата Хромтауского района Актюбинской области от 25 апреля 2016 года № 19. Зарегистрировано Департаментом юстиции Актюбинской области 18 мая 2016 года № 4934. Утратило силу решением маслихата Хромтауского района Актюбинской области от 13 марта 2019 года № 292
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам здравохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельских населенных пунктах по Хромтаускому району
  kaz: Хромтау ауданы бойынша азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын  табиғи  аумақтар саласындағы мамандарына жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
