act_code: '110807'
requisite: Решение маслихата Кобдинского района Актюбинской области от 24 февраля 2017 года № 62. Зарегистрировано Департаментом юстиции Актюбинской области 24 марта 2017 года № 5349. Утратило силу решением маслихата Кобдинского района Актюбинской области от 26 ноября 2018 года № 189
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах Кобдинского района
  kaz: Қобда ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
