  title:
    rus: О внесении изменений в решение Алгинского районного маслихата от 17 апреля 2014 года № 151 «Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, культуры, спорта и ветеринарии, работающим в сельских населенных пунктах Алгинского района»
    kaz: Алға аудандық мәслихатының 2014 жылғы 17 сәуірдегі № 151 «Алға ауданының ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласының мамандарына жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/140595/rus
