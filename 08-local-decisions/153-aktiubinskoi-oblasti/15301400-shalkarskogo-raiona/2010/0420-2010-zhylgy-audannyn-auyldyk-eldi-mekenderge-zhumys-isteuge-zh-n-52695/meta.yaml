act_code: '52695'
requisite: Ақтөбе облысы Шалқар аудандық мәслихатының 2010 жылғы 20 сәуірдегі № 199 шешімі. Ақтөбе облысы Шалқар ауданының Әділет басқармасында 2010 жылдың 24 мамырда № 3-13-133 тіркелді. Күші жойылды - Ақтөбе облысы Шалқар аудандық мәслихатының 2010 жылғы 23 желтоқсандағы № 239 шешімімен
title:
  rus: 2010 жылғы ауданның ауылдық елді мекендерге жұмыс істеуге және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау көтерме жәрдемақы және тұрғын үй сатып алу үшін кредит ұсыну туралы
