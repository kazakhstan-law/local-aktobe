act_code: '44349'
requisite: Ақтөбе облысы Әйтеке би аудандық мәслихатының 2009 жылғы 29 қаңтардағы N 97 шешімі. Ақтөбе облысының Әйтеке би аудандық Әділет басқармасында 2009 жылдың 20 ақпанда N 3-2-69 тіркелді. Күші жойылды - Ақтөбе облысы Әйтеке би аудандық мәслихатының 2010 жылғы 16 сәуірдегі № 188 шешімімен
