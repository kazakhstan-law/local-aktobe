requisite: Ақтөбе облысы Темір аудандық мәслихатының 2008 жылғы 19 желтоқсандағы N 83 шешімі. Ақтөбе облысының Темір аудандық Әділет басқармасында 2009 жылғы 16 қаңтарда N 3-10-91 тіркелді. Күші жойылды - Ақтөбе облысы Темір аудандық мәслихатының 2010 жылғы 12 ақпандағы N 177 шешімімен
