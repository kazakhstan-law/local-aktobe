act_code: '88427'
requisite: Решение от 11.03.2015 №273, Маслихат Каргалинского района. Заголовок решения с изменениями, внесенными решениями маслихата Каргалинского района Актюбинской области от 05.06.2015 № 296; от 09.10.2015 № 347
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Каргалинского района на 2015 год
  kaz: Қарғалы ауданының ауылдық елді мекендерге 2015 жылға жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы
