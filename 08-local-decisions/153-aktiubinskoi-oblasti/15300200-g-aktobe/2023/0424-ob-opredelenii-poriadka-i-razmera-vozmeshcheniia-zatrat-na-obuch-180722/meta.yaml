  title:
    rus: О внесении изменений в решение маслихата города Актобе от 24 апреля 2023 года № 14 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в городе Актобе»
    kaz: Ақтөбе қалалық мәслихатының 2023 жылғы 24 сәуірдегі № 14 «Ақтөбе қаласында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
