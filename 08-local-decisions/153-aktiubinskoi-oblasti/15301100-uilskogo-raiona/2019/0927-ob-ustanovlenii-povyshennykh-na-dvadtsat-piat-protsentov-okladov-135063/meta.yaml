title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения и культуры, являющимся гражданскими служащими и работающим в сельских населенных пунктах Уилского района
  kaz: Ойыл ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру және мәдениет саласының мамандарына жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
