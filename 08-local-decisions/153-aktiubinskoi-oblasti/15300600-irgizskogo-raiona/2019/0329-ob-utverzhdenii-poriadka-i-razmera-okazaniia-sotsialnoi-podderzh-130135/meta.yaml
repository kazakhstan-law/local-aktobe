act_code: '130135'
requisite: Решение Иргизского районного маслихата Актюбинской области от 29 марта 2019 года № 216. Зарегистрировано Департаментом юстиции Актюбинской области 3 апреля 2019 года № 6057. Утратило силу решением Иргизского районного маслихата Актюбинской области от 20 августа 2020 года № 328
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Иргизского района
  kaz: Ырғыз ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
