  title:
    rus: О внесении изменения и дополнения в решение Уилского районного маслихата от 08 ноября 2013 года № 119 «О предоставлении  социальной помощи на приобретение  топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах Уилского района»
    kaz: Ойыл аудандық мәслихатының 2013 жылғы 08 қарашадағы № 119 «Ауылдық елді  мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы» шешіміне өзгеріс және толықтыру енгізу туралы
