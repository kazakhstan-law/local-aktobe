  requisite: Решение внеочередной второй сессии маслихата города Актобе Актюбинской области от 30 октября 2007 года N 16. Зарегистрировано Управлением юстиции города Актобе Актюбинской области 14 ноября 2007 года N 3-1-77. Утратило силу в связи с истечением срока действия - (письмо Управления юстиции города Актобе Актюбинской области от 10 января 2008 года N 1-06/82)
  title:
    rus: О внесении изменений и дополнений в решение N 284 очередной тридцать пятой сессии маслихата города Актобе от 26 декабря 2006 года "О бюджете города Актобе на 2007 год", зарегистрированного в управлении юстиции 9 января 2007 года за N 3-1-63
    kaz: Ақтөбе қалалық мәслихатының кезекті отыз бесінші сессиясының 2006 жылғы 26 желтоқсандағы "2007 жылға арналған Ақтөбе қаласының бюджеті туралы" әділет басқармасында 2007 жылғы 9 қаңтарда N 3-1-63 санымен тіркелген N 284 шешіміне өзгерістер мен толықтырулар енгізу туралы
