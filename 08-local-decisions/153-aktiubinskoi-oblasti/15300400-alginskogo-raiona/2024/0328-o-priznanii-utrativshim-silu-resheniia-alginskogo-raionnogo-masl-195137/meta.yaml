act_code: '195137'
requisite: Решение Алгинского районного маслихата Актюбинской области от 28 марта 2024 года № 138. Зарегистрировано Департаментом юстиции Актюбинской области 29 марта 2024 года № 8552-04
title:
  rus: О признании утратившим силу решения Алгинского районного маслихата от 7 февраля 2024 года № 126 «Об оказании дополнительной социальной помощи отдельным категориям нуждающихся граждан Алгинского района к 35 – летию вывода ограниченного контингента советских войск из Демократической Республики Афганистан»
  kaz: Алға аудандық мәслихатының 2024 жылғы 7 ақпандағы № 126 «Ауғанстан Демократиялық Республикасынан Кеңес әскерлерінің шектеулі контингентін шығаруының 35-жылдығына орай Алға ауданының мұқтаж азаматтарының санаттарына қосымша әлеуметтік көмек көрсету туралы» шешімінің күшін жою туралы
