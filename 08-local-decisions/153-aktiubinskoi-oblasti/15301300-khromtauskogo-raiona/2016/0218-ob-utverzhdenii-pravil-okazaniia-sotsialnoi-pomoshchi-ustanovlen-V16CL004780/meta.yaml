  title:
    rus: О внесении изменений в решение Хромтауского районного маслихата от 18 февраля 2016 года № 323 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Хромтауском районе»
    kaz: Хромтау аудандық мәслихатының 2016 жылғы 18 ақпандағы № 323 «Хромтау ауданында әлеуметтік көмек көрсету, мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
