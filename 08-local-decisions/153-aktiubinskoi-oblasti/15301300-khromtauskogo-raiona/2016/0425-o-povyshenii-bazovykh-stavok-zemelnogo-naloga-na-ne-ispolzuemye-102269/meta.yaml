  title:
    rus: О внесении изменений в решение Хромтауского районного маслихата от 25 апреля 2016 года № 17 «О повышении базовых ставок земельного налога  и ставок единого земельного налога на не используемые земли сельскохозяйственного назначения по Хромтаускому району»
    kaz: Хромтау аудандық мәслихатының 2016 жылғы 25 сәуірдегі № 17 «Хромтау ауданы бойынша пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін арттыру туралы» шешіміне өзгерістер енгізу туралы
