  title:
    rus: О внесении изменений в решение Шалкарского районного маслихата от 15 сентября 2023 года № 105 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Шалкарском районе»
    kaz: Шалқар аудандық мәслихатының 2023 жылғы 15 қыркүйектегі № 105 «Шалқар ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
