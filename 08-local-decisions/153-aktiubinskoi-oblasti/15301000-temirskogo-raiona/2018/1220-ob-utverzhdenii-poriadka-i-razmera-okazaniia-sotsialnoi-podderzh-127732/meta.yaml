act_code: '127732'
requisite: Решение Темирского районного маслихата Актюбинской области от 20 декабря 2018 года № 286. Зарегистрировано Управлением юстиции Темирского района Департамента юстиции Актюбинской области 27 декабря 2018 года № 3-10-234. Утратило силу решением Темирского районного маслихата Актюбинской области от 20 августа 2020 года № 510
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Темирского района
  kaz: Темір ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
