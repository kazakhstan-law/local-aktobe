act_code: '162096'
requisite: Решение Кобдинского районного маслихата Актюбинской области от 22 декабря 2021 года № 113
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Кобдинского района на 2022 год
  kaz: Қобда ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2022 жылға әлеуметтік қолдау көрсету туралы
