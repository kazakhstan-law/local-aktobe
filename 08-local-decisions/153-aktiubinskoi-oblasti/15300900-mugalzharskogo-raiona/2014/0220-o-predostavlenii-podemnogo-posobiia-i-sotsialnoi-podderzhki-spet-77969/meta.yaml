act_code: '77969'
requisite: Решение маслихата Мугалжарского района Актюбинской области от 20 февраля 2014 года № 145. Зарегистрировано Департаментом юстиции Актюбинской области 12 марта 2014 года № 3808
title:
  rus: О предоставлении подъемного пособия и социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мугалжарского района в 2014 году
  kaz: 2014 жылы Мұғалжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы
