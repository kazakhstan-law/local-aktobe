act_code: '46004'
requisite: Ақтөбе облысы Алға аудандық мәслихатының 2009 жылғы 24 сәуірдегі N 6 шешімі. Ақтөбе облысының Алға аудандық әділет басқармасында 2009 жылдың 19 мамырдағы N 3-3-80 тіркелді. Күші жойылды - Ақтөбе облысы Алға аудандық мәслихатының 2018 жылғы 12 қыркүйектегі № 196 шешімімен
title:
