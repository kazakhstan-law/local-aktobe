requisite: Решение маслихата Шалкарского района Актюбинской области от 24 сентября 2013 года № 102. Зарегистрировано Департаментом юстиции Актюбинской области 9 октября 2013 года № 3650. Утратило силу решением маслихата Шалкарского района Актюбинской области от 19 октября 2018 года № 262
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах Шалкарского района
  kaz: Шалқар ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек көрсету туралы
