  title:
    rus: О внесении изменения в решение Актюбинского областного маслихата от 17 мая 2021 года № 39 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Актюбинской области при амбулаторном лечении бесплатно»
    kaz: «Ақтөбе облысы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, бейімделген емдік өнімдерді, медициналық бұйымдарды қосымша тегін беру туралы» Ақтөбе облыстық мәслихатының 2021 жылғы 17 мамырдағы № 39 шешіміне өзгеріс енгізу туралы
