act_code: '137666'
requisite: Решение Шалкарского районного маслихата Актюбинской области от 25 декабря 2019 года № 405. Зарегистрировано Департаментом юстиции Актюбинской области 26 декабря 2019 года № 6612
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Шалкарского района на 2020 год
  kaz: Шалқар ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер əкімдері аппараттарының мемлекеттік қызметшілеріне 2020 жылға әлеуметтік қолдау көрсету туралы
