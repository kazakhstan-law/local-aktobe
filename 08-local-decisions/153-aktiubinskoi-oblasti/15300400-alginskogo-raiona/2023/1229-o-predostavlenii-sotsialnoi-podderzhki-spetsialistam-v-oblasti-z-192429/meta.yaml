  requisite: Решение Алгинского районного маслихата Актюбинской области от 25 сентября 2024 года № 203
  title:
    rus: О внесении изменения в решение Алгинского районного маслихата от 29 декабря 2023 года № 124 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Алгинского района на 2024 год»
    kaz: Алға аудандық мәслихатының 2023 жылғы 29 желтоқсандағы № 124 «Алға ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылға әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201022/rus
