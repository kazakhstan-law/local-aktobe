title:
  rus: 'Об установлении стоимости разовых талонов для лиц, реализующих товары на рынках: "Достык" и "Арай"'
  kaz: '"Достық" және "Арай" жабық базарында тауар сатушы тұлғалар үшін біржолғы талон құнын белгілеу туралы'
