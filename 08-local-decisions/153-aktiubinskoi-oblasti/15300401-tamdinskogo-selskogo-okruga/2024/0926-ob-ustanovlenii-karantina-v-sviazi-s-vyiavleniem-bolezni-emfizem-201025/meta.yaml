requisite: Решение Токмансайского сельского округа Алгинского района Актюбинской области от 26 сентября 2024 года № 19. Утратило силу решением акима Токмансайского сельского округа Алгинского района Актюбинской области от 11 ноября 2024 года № 20 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об установлении карантина в связи с выявлением болезни эмфизематозный карбункул среди крупного рогатого скота в крестьянских хозяйствах  «Жеті қазына» и «Өлетті» Токмансайского сельского округа Алгинского района Актюбинской области
  kaz: Ақтөбе облысы Алға ауданы Тоқмансай ауылдық округінің «Жеті қазына» және «Өлетті» шаруа қожалықтары мүйізді ірі қара малдарының арасында қарасан жұқпалы ауруы анықталуына байланысты карантин белгілеу туралы
