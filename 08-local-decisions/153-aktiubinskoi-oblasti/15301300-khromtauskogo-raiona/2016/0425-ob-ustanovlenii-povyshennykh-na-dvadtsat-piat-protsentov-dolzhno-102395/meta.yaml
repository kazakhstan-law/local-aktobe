  title:
    rus: О внесении изменения в решение районного маслихата от 25 апреля 2016 года № 19 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах Хромтауского района»
    kaz: Аудандық мәслихаттың 2016 жылғы 25 сәуірдегі № 19 «Хромтау ауданы бойынша азаматтық қызметші болып табылатын және ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарына жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» шешіміне өзгеріс енгізу туралы
