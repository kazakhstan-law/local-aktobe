act_code: '137669'
requisite: Решение Иргизского районного маслихата Актюбинской области от 25 декабря 2019 года № 261. Зарегистрировано Департаментом юстиции Актюбинской области 27 декабря 2019 года № 6614. Утратило силу решением Иргизского районного маслихата Актюбинской области от 15 сентября 2023 года № 55
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Иргизского района
  kaz: Ырғыз ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы
