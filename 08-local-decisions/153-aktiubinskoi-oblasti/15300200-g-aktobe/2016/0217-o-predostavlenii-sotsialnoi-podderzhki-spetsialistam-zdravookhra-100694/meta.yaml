act_code: '100694'
requisite: Решение маслихата города Актобе Актюбинской области от 17 февраля 2016 года № 420. Зарегистрировано Департаментом юстиции Актюбинской области 18 марта 2016 года № 4806
title:
  rus: О предоставлении социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Актобе на 2016 год
  kaz: Ақтөбе қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына 2016 жылға әлеуметтік қолдау көрсету туралы
