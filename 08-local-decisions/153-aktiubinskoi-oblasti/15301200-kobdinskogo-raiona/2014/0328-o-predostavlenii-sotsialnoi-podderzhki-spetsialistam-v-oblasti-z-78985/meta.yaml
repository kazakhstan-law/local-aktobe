requisite: Решение маслихата Хобдинского района Актюбинской области от 28 марта 2014 года № 141. Зарегистрировано Департаментом юстиции Актюбинской области 22 апреля 2014 года № 3845. Утратило силу в связи с истечением срока применения – (письмо Кобдинского районного маслихата Актюбинской области от 5 января 2015 года № 5-05/02)
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Хобдинского района в 2014 году
  kaz: 2014 жылы Қобда ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы
