requisite: Решение маслихата Кобдинского района Актюбинской области от 27 июля 2011 года № 212. Зарегистрировано Департаментом юстиции Актюбинской области 16 августа 2011 года № 3-7-122. Утратило силу в связи с истечением срока действия - письмо маслихата Кобдинского района Актюбинской области от 10 мая 2012 года № 5-05/46
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау ұсыну туралы
