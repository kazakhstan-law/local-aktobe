requisite: Ақтөбе облысы Ойыл аудандық мәслихатының 2010 жылғы 19 ақпандағы № 194 шешімі. Ақтөбе облысы Ойыл ауданының Әділет басқармасында 2010 жылдың 19 наурызда № 3-11-76 тіркелді. Күші жойылды - Ақтөбе облысы Ойыл аудандық мәслихатының 2013 жылғы 27 наурыздағы № 86 шешімімен
title:
  rus: Ойыл ауданының тұрғындарына коммуналдық қызметтерді тұтынғаны үшін және телефонға абоненттік ақы тарифтерінің өсуіне байланысты шығындарды өтуге арналған тұрғын үй көмегін беру Ережесін бекіту туралы
