requisite: Решение маслихата Айтекебийского района Актюбинской области от 14 января 2016 года № 293
title:
  rus: О признании утратившем силу решение Айтекебийского районного маслихата № 263 от 10 ноября 2015 года "Об утверждении Методики ежегодной оценки деятельности административных государственных служащих корпуса "Б" государственного учреждения "Аппарат Айтекебийского районного маслихата"
  kaz: Аудандық мәслихаттың 2015 жылғы 10 қарашадағы "Әйтеке би аудандық мәслихат аппаратының "Б" корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалау әдістемесін бекіту туралы" № 263 шешімінің күшін жою туралы
