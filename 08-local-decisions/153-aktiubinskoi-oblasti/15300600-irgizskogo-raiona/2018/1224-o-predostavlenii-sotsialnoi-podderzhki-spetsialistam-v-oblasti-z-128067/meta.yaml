act_code: '128067'
requisite: Решение Иргизского районного маслихата Актюбинской области от 24 декабря 2018 года № 189. Зарегистрировано Управлением юстиции Иргизского района Департамента юстиции Актюбинской области 25 декабря 2018 года № 3-5-201
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Иргизского района на 2019 год
  kaz: Ырғыз ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылға әлеуметтік қолдау көрсету туралы
