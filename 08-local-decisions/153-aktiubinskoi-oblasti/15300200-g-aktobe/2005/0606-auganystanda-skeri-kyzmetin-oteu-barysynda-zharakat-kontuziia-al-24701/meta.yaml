act_code: '24701'
requisite: Ақтөбе қалалық мәслихатының 2005 жылғы 6 маусымдағы N 143 шешімі. Ақтөбе қаласының әділет басқармасында 2005 жылдың 12 шілдесінде N 3-1-15 тіркелді. Күші жойылды - Ақтөбе қалалық мәслихатының 2009 жылғы 25 сәуірдегі N 169 шешімімен
title:
  rus: Ауғаныстанда әскери қызметін өтеу барысында жарақат, контузия алған, жарымжан немесе мүгедек болған әскери қызметкерлер мен олардың отбасы мүшелеріне және әскери қызметін өтеу кезінде құрбан болған жауынгерлердің ата-аналарына коммуналдық (жылу, су, газ, электрмен жабдықтау, канализация, қоқыстарды тазалау, лифт қызметі) және байланыс қызметтерінің ақысын өтеу бойынша жеңілдіктер ұсыну қағидасын бекіту туралы
