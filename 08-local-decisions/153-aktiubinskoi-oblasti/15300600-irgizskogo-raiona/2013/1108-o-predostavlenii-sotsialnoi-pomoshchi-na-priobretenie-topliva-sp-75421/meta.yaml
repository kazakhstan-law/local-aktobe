  title:
    rus: О внесении изменения в решение районного маслихата от 8 ноября 2013 года № 98 "О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций, проживающим и работающим в сельских населенных пунктах Иргизского района"
    kaz: '"Ырғыз ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік ұйымдары мамандарына отын сатып алуға әлеуметтік көмек көрсету туралы" аудандық мәслихаттың 2013 жылғы 8 қарашадағы № 98 шешіміне өзгеріс енгізу туралы'
