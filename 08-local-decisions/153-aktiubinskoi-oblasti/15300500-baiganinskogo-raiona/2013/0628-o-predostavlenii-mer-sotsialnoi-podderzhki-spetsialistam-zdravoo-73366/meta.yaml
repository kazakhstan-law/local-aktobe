act_code: '73366'
requisite: Решение маслихата Байганинского района Актюбинской области от 28 июня 2013 года № 72. Зарегистрировано Департаментом юстиции Актюбинской области 11 июля 2013 года № 3605. Утратило силу решением маслихата Байганинского района Актюбинской области от 19 февраля 2014 года № 111
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные пункты Байганинского района в 2013 году
  kaz: Байғанин ауданының ауылдық елді мекендеріне 2013 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
