  title:
    rus: О внесении изменений в решение районного маслихата от 2 марта 2018 года № 194 «О повышении базовых ставок земельного налога и ставок единого земельного налога на не используемые земли сельскохозяйственного назначения в Айтекебийском районе»
    kaz: Аудандық маслихатының 2018 жылғы 2 наурыздағы № 194 «Әйтеке би ауданында пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін және бірыңғай жер салығының мөлшерлемелерін арттыру туралы» шешіміне өзгерістер енгізу туралы
