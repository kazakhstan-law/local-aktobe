act_code: '110513'
requisite: Решение маслихата Алгинского района Актюбинской области от 28 февраля 2017 года № 74. Зарегистрировано Департаментом юстиции Актюбинской области 14 марта 2017 года № 5330
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Алгинского района на 2017 год
  kaz: Алға ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2017 жылға әлеуметтік қолдау көрсету туралы
