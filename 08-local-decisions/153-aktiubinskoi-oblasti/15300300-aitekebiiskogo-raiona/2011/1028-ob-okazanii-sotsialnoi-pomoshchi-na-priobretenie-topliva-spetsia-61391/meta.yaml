requisite: Решение маслихата Айтекебийского района Актюбинской области от 28 октября 2011 года № 263. Зарегистрировано Департаментом юстиции Актюбинской области 18 ноября 2011 года № 3-2-122. Утратило силу решением маслихата Айтекебийского района Актюбинской области от 27 июня 2013 года № 101
title:
  rus: Об оказании социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Айтекебийского района
  kaz: Әйтеке би ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
