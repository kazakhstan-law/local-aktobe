requisite: Ақтөбе облысы Ырғыз аудандық мәслихатының 2009 жылғы 22 шілдедегі № 96 шешімі. Ақтөбе облысының Ырғыз аудандық әділет басқармасында 2009 жылдың 10 тамызда N 3-5-100 тіркелді. Күші жойылды - Ақтөбе облысы Ырғыз аудандық мәслихатының 2012 жылғы 4 мамырдағы № 20 шешімімен
