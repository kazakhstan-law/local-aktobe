  kaz: 2011 жылғы денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау ретінде көтерме жәрдемақы мен бюджеттік кредит беру туралы
