requisite: Решение маслихата Шалкарского района Актюбинской области от 25 декабря 2015 года № 251. Зарегистрировано Департаментом юстиции Актюбинской области 25 января 2016 года № 4716
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шалкарского района на 2016 год
  kaz: Шалқар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылға әлеуметтік қолдау шараларын ұсыну туралы
