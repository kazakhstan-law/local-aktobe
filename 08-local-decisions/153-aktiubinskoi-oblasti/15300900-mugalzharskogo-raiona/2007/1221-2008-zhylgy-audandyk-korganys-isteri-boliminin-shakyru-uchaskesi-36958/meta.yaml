requisite: Ақтөбе облысы Мұғалжар аудандық әкімінің 2007 жылғы 21 желтоқсандағы N 6 шешімі. Ақтөбе облысы Мұғалжар аудандық әділет басқармасында 2008 жылғы 17 қаңтарда N 3-9-59 тіркелді. Күші жойылды - Ақтөбе облысы Мұғалжар ауданының әкімдігінің 2009 жылғы 8 шілдедегі N 261 қаулысымен
