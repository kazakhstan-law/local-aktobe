  requisite: Решение Байганинского районного маслихата Актюбинской области от 2 июня 2025 года № 281
  title:
    rus: О внесении изменения в решение Байганинского районного маслихата от 25 декабря 2024 года № 223 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Байганинского района на 2025 год»
    kaz: Байғанин аудандық мәслихатының 2024 жылғы 25 желтоқсандағы № 223 «Байғанин ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2025 жылға әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/211123/rus
