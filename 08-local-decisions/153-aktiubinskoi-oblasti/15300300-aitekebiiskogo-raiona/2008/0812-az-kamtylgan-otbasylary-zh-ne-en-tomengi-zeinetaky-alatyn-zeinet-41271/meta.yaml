requisite: Ақтөбе облысы Әйтеке би аудандық мәслихатының 2008 жылғы 12 тамыздағы N 62 шешімі. Ақтөбе облысының Әйтеке би аудандық әділет басқармасында 2008 жылдың 22 тамызда N 3-2-60 тіркелді. Күші жойылды - Ақтөбе облысы Әйтеке би аудандық мәслихатының 2011 жылғы 28 шілдедегі № 257 шешімімен
