title:
  rus: О предоставлении Компании  “Шелл Темир Петролеум Девелопмент Б. В." права временного пользования земельными участками для бурения разведочных скважин и проведения сейсморазведочных работ на территории Байганинского, Мугалжарского и Темирского районов
  kaz: Байғанин, Мұғалжар және Темір аудаңдарында барлау скважиналарын бұрғылау және сейсмологиялық барлау жұмыстарын жүргізу үшін "Шелл Темир Петролеум Девелопмент Б. В." Компаниясына уақытша жер учаскелерін пайдалану құқығын беру туралы
