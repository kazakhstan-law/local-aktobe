requisite: Решение Кобдинского районного маслихата Актюбинской области от 7 октября 2022 года № 229. Утратило силу решением Кобдинского районного маслихата Актюбинской области от 28 апреля 2025 года № 327 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Кобдинского района Актюбинской области
  kaz: Ақтөбе облысы, Қобда ауданының аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санының айқындау қағидаларын бекіту туралы
