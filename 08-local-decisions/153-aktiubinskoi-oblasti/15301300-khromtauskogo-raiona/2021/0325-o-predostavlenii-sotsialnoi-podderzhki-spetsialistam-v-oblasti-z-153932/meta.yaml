act_code: '153932'
requisite: Решение Хромтауского районного маслихата Актюбинской области от 25 марта 2021 года № 41. Зарегистрировано Департаментом юстиции Актюбинской области 30 марта 2021 года № 8173
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Хромтауского района на 2021 год
  kaz: Хромтау ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылға арналған әлеуметтік қолдау көрсету туралы
