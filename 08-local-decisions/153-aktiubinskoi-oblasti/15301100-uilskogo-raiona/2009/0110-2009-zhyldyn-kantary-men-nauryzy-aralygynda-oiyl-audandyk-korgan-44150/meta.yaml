requisite: Ақтөбе облысы Ойыл аудандық әкімінің 2009 жылғы 10 қаңтардағы N 1 шешімі. Ақтөбе облысының Ойыл аудандық әділет басқармасында 2009 жылдың 4 ақпанда N 3-11-54 тіркелді. Күші жойылды - Ақтөбе облысы Ойыл аудандық әкімінің 2009 жылғы 18 маусымдағы № 7 шешімімен
