  title:
    rus: О внесении изменений и дополнений в решение Мугалжарского районного маслихата от 22 мая 2020 года № 435 «Об утверждении проектов (схем) зонирования земель и поправочных коэффициентов к базовым ставкам платы за земельные участки и границы оценочных зон в городах Кандыагаш, Эмба, Жем и сельских населенных пунктах Мугалжарского района»
    kaz: Мұғалжар аудандық мәслихатының 2020 жылғы 22 мамырдағы № 435 «Мұғалжар ауданының Қандыағаш, Ембі, Жем қалалары мен ауылдық елді мекендерінде жерді аймақтарға бөлу жобаларын (схемаларын) және бағалау аймақтарының шекаралары мен жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
