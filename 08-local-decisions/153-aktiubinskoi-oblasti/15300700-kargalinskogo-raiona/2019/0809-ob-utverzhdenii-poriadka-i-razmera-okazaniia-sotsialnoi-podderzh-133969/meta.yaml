requisite: Решение Каргалинского районного маслихата Актюбинской области от 9 августа 2019 года № 375. Зарегистрировано Департаментом юстиции Актюбинской области 13 августа 2019 года № 6348. Утратило силу решением Каргалинского районного маслихата Актюбинской области от 3 июня 2020 года № 470
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Каргалинского района
  kaz: Қарғалы ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
