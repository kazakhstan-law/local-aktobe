  title:
    rus: О внесении изменений в решение Мугалжарского районого маслихата Актюбинской области от 12 апреля 2016 года № 14 "Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Мугалжарском районе"
    kaz: '"Мұғалжар ауданында әлеуметтік көмек көрсету, мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы" Мұғалжар аудандық мәслихатының 2016 жылғы 12 сәуірдегі № 14 шешіміне өзгерістер енгізу туралы'
