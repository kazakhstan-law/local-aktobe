act_code: '91192'
requisite: Решение Темирского районного маслихата Актюбинской области от 10 июня 2015 года № 252. Зарегистрировано Департаментом юстиции Актюбинской области 25 июня 2015 года № 4387. Утратило силу решением Темирского районного маслихата Актюбинской области от 18 марта 2022 года № 169
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Темирского района
  kaz: Темір ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы
