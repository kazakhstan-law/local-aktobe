act_code: '100362'
requisite: Решение маслихата Хромтауского района Актюбинской области от 18 февраля 2016 года № 319. Зарегистрировано Департаментом юстиции Актюбинской области 14 марта 2016 года № 4784
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Хромтауского района на 2016 год
  kaz: Хромтау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2016 жылға әлеуметтік қолдау шараларын ұсыну туралы
