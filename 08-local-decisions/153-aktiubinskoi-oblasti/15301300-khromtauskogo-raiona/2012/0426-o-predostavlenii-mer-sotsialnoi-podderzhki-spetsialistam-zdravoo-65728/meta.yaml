requisite: Решение маслихата Хромтауского района Актюбинской области от 26 апреля 2012 года № 30. Зарегистрировано Департаментом юстиции Актюбинской области 29 мая 2012 года № 3-12-151. Утратило силу решением маслихата Хромтауского района Актюбинской области от 10 июля 2013 года № 112
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
