requisite: Ақтөбе облысы Темір аудандық мәслихатының 2009 жылғы 23 сәуірдегі № 112 шешімі. Ақтөбе облысының Темір аудандық әділет басқармасында 2009 жылдың 28 мамырда № 3-10-108 тіркелді. Күші жойылды - Ақтөбе облысы Темір аудандық мәслихатының 2012 жылғы 11 маусымдағы № 43 шешімімен
