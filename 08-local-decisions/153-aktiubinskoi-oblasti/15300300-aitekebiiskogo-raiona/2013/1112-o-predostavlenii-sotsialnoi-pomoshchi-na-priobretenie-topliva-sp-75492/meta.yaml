requisite: Решение Айтекебийского районного маслихата Актюбинской области от 12 ноября 2013 года № 118. Зарегистрировано Департаментом юстиции Актюбинской области 28 ноября 2013 года № 3687. Утратило силу решением Айтекебийского районного маслихата Актюбинской области от 23 ноября 2018 года № 234
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах Айтекебийского района
  kaz: Әйтеке би ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек көрсету туралы
