  title:
    rus: О внесении изменений в решение Шалкарского районного маслихата от 14 декабря 2018 года № 282 «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Шалкарского района»
    kaz: Шалқар аудандық мәслихатының 2018 жылғы 14 желтоқсандағы № 282 «Шалқар ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы» шешіміне өзгерістер енгізу туралы
