title:
  rus: О предоставлении компании с ограниченной ответственностью "ТЕПКО'' права временного использования земельных участков для проведения бурения разведочной скважины Центральный Якут 1 в Байганинском районе Актюбинской области
  kaz: Ақтөбе облысы Байғанин ауданында 1 орталық Якут барлау іздестіру скважинасын бұрғылау жұмыстарын жүргізу үшін «ТЕПКО» жауапкершілігі шектеулі компаниясына уақытша жер бөлігін пайдалану құқылығын беру туралы
