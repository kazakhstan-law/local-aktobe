  title:
    rus: О внесении изменений в решение Шалкарского районного маслихата от 17 ноября 2022 года № 323 «Об утверждении тарифов для населения на сбор, транспортировку, сортировку и захоронению твердых бытовых отходов по Шалкарскому району»
    kaz: Шалқар аудандық мәслихатының 2022 жылғы 17 қарашадағы № 323 «Шалқар ауданы бойынша халық үшін қатты тұрмыстық қалдықтарды жинауға, тасымалдауға, сұрыптауға және көмуге арналған тарифтерді бекіту туралы» шешіміне өзгерістер енгізу туралы
