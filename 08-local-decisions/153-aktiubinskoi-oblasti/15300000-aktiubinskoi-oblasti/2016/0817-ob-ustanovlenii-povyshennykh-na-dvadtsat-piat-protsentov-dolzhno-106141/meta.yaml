  title:
    rus: О внесении изменений в решение областного маслихата от 17 августа 2016 года № 51 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и лесного хозяйства, являющимся гражданскими служащими и работающим в сельской местности»
    kaz: Облыстық мәслихаттың 2016 жылғы 17 тамыздағы № 51 «Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және орман шаруашылығы саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы» шешіміне өзгерістер енгізу туралы
