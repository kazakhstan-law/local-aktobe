requisite: Ақтөбе облысы Темір аудандық мәслихатының 2010 жылғы 12 ақпандағы № 179 шешімі. Ақтөбе облысының Темір аудандық Әділет басқармасында 2010 жылдың 26 ақпанда № 3-10-123 тіркелді. Күші жойылды - Ақтөбе облысы Темір аудандық мәслихатының 2017 жылғы 17 ақпандағы № 84 шешімімен
