requisite: Решение маслихата Айтекебийского района Актюбинской области от 2 марта 2018 года № 189. Зарегистрировано Управлением юстиции Айтекебийского района Актюбинской области 19 марта 2018 года № 3-2-139
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Айтекебийского района на 2018 год
  kaz: Әйтеке би ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылға әлеуметтік қолдау көрсету туралы
