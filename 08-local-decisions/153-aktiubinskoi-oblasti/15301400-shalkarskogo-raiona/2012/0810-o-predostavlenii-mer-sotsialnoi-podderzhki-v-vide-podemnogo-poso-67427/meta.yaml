requisite: Решение маслихата Шалкарского района Актюбинской области от 10 августа 2012 года № 33. Зарегистрировано Департаментом юстиции Актюбинской области 31 августа 2012 года № 3-13-174. Утратило силу решением маслихата Шалкарского района Актюбинской области от 19 марта 2013 года № 67
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и кредита для приобретения и строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района в 2012 году
  kaz: 2012 жылы ауданның ауылдық елді мекендеріне жұмыс істеуге және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау мақсатында көтерме жәрдемақы және тұрғын үй сатып алу және салу үшін кредит ұсыну туралы
