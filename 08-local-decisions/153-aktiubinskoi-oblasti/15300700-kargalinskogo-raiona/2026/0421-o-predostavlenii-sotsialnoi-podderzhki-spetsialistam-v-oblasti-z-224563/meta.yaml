act_code: '224563'
requisite: Решение Каргалинского районного маслихата Актюбинской области от 21 апреля 2026 года № 446
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Каргалинского района на 2026 год
  kaz: Қарғалы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2026 жылға әлеуметтік қолдау көрсету туралы
