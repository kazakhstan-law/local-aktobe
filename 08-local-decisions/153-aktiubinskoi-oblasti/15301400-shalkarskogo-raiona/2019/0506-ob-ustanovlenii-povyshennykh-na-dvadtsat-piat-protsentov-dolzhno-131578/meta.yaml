requisite: Решение Шалкарского районного маслихата Актюбинской области от 6 мая 2019 года № 338. Зарегистрировано Департаментом юстиции Актюбинской области 15 мая 2019 года № 6144. Утратило силу решением Шалкарского районного маслихата Актюбинской области от 12 марта 2021 года № 40
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности по Шалкарскому району
  kaz: Шалқар ауданы бойынша азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
