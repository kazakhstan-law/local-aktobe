requisite: Решение Байганинского районного маслихата Актюбинской области от 21 октября 2013 года № 91. Зарегистрировано Департаментом юстиции Актюбинской области 5 ноября 2013 года № 3661. Утратило силу решением Байганинского районного маслихата Актюбинской области от 26 ноября 2018 года № 182
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек көрсету туралы
