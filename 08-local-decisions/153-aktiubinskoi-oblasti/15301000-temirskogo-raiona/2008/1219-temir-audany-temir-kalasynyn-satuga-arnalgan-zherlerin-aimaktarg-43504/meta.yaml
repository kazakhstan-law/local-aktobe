act_code: '43504'
requisite: Ақтөбе облысы Темір аудандық мәслихатының 2008 жылғы 19 желтоқсандағы N 75 шешімі. Ақтөбе облысының Темір аудандық әділет басқармасында 2009 жылдың 16 қаңтарда N 3-10-95 тіркелді
title:
