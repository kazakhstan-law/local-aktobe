  title:
    rus: О внесений изменении в решение Уилского районного маслихата от 27 сентября 2019 года № 333 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта, ветеринарии, являющимся гражданскими служащими и работающим в сельской местности по Уилскому району»
    kaz: Ойыл аудандық мәслихатының 2019 жылғы 27 қыркүйектегі № 333 «Ойыл ауданы бойынша азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/160761/rus
