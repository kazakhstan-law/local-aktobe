act_code: '194668'
requisite: Решение Иргизского районного маслихата Актюбинской области от 18 марта 2024 года № 118. Зарегистрировано Департаментом юстиции Актюбинской области 20 марта 2024 года № 8533-04
title:
  rus: О признании утратившим силу решения Иргизского районного маслихата от 6 февраля 2024 года № 106 «Об оказании дополнительной социальной помощи отдельным категориям нуждающихся граждан Иргизского района к 35–летию вывода ограниченного контингента советских войск из Демократической Республики Афганистан»
  kaz: Ырғыз аудандық мәслихатының 2024 жылғы 6 ақпандағы № 106 «Ауғанстан Демократиялық Республикасынан Кеңес әскерлерінің шектеулі контингентін шығаруының 35-жылдығына орай Ырғыз ауданының мұқтаж азаматтарының санаттарына қосымша әлеуметтік көмек көрсету туралы» шешімінің күшін жою туралы
