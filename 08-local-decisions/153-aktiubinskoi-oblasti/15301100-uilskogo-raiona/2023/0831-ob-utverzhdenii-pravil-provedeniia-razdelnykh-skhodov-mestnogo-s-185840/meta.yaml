requisite: Решение Уилского районного маслихата Актюбинской области от 31 августа 2023 года № 72
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Уилского района
  kaz: Ойыл ауданының елді мекендері аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындаудың қағидаларын бекіту туралы
