  requisite: Решение Айтекебийского районного маслихата Актюбинской области от 17 февраля 2020 года № 373. Зарегистрировано Департаментом юстиции Актюбинской области 19 февраля 2020 года № 6820. Утратило силу решением Айтекебийского районного маслихата Актюбинской области от 24 августа 2020 года № 449
  title:
    rus: О внесении изменения в решение Айтекебийского районного маслихата от 16 мая 2019 года № 291 «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Айтекебийского района»
    kaz: Әйтеке би аудандық мәслихатының 2019 жылғы 16 мамырдағы № 291 «Әйтеке би ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/139671/rus
