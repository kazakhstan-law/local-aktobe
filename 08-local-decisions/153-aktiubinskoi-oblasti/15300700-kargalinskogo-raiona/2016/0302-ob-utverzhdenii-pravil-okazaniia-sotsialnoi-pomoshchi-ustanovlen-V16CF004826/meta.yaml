    kaz: Қарғалы аудандық мәслихатының 2016 жылғы 2 наурыздағы № 404 «Қарғалы ауданында әлеуметтік көмек көрсету, мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау Қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
