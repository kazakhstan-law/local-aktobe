  title:
    rus: О внесении изменений в решение Кобдинского районного маслихата от 21 декабря 2022 года № 261 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану»
    kaz: Қобда аудандық мәслихатының 2022 жылғы 21 желтоқсандағы № 261 «Мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
