act_code: '110391'
requisite: Решение маслихата Каргалинского района Актюбинской области от 17 февраля 2017 года № 110. Зарегистрировано Департаментом юстиции Актюбинской области 9 марта 2017 года № 5305
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Каргалинского района на 2017 год
  kaz: Қарғалы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2017 жылға әлеуметтік қолдау көрсету туралы
