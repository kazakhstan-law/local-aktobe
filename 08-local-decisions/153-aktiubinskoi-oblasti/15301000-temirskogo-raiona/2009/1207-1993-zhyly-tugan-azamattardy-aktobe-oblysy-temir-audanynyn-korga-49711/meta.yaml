requisite: Ақтөбе облысы Темір аудандық әкімінің 2009 жылғы 7 желтоқсандағы № 8 шешімі. Ақтөбе облысының Темір аудандық Әділет басқармасында 2010 жылдың 6 қаңтарда № 3-10-116 тіркелді. Күші жойылды - Ақтөбе облысы Темір ауданының әкімінің 2010 жылғы 10 желтоқсандағы № 10 шешімімен
