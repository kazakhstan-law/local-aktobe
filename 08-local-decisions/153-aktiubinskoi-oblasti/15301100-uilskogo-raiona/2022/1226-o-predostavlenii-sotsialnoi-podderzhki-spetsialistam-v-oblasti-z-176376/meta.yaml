  requisite: Решение Уилского районного маслихата Актюбинской области от 31 августа 2023 года № 71
  title:
    rus: О внесении изменения в решение Уилского  районного маслихата от 26 декабря 2022 года № 194  «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Уилского района на 2023 год»
    kaz: Ойыл  аудандық мәслихатының 2022 жылғы 26 желтоқсандағы № 194 «2023 жылға арналған Ойыл ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
