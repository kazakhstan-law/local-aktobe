requisite: Решение Мартукского районного маслихата Актюбинской области от 1 июня 2018 года № 151. Зарегистрировано Управлением юстиции Мартукского района Департамента юстиции Актюбинской области 25 июня 2018 года № 3-8-183. Утратило силу решением Мартукского районного маслихата Актюбинской области от 22 ноября 2018 года № 184
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Мартукского района
  kaz: Мәртөк ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
