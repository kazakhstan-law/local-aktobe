title:
  rus: О признании утратившим силу решение Айтекебийского районного маслихата № 174 от 08 августа 2014 года "Об утверждении предельных размеров социальной помощи, представляемой отдельным категориям нуждающихся граждан, при наступлении трудной жизненной ситуации"
  kaz: Әйтеке би аудандық мәслихатының 2014 жылғы 8 тамыздағы "Мұқтаж азаматтардың жекелеген санаттарына өмірлік қиын жағдай туындаған кезде көрсететін әлеуметтік көмектің шекті мөлшерлерін бекіту туралы" № 174 шешімінің күшін жою туралы
