act_code: '46063'
requisite: Ақтөбе облысы Байғанин аудандық мәслихатының 2009 жылғы 24 сәуірдегі N 90 шешімі. Ақтөбе облысының Байғанин аудандық әділет басқармасында 2009 жылдың 20 мамырда N 3-4-75 тіркелді. Күші жойылды - Ақтөбе облысы Байғанин аудандық мәслихатының 2012 жылғы 29 қазандағы № 42 шешімімен
