    kaz: «Мұғалжар ауданының ауылдық елді мекендерге 2015 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын айқындау туралы» 2015 жылғы 13 наурыздағы № 211 аудандық мәслихаттың шешіміне өзгерістер енгізу туралы
