requisite: Решение Уилского районного маслихата Актюбинской области от 8 ноября 2013 года № 119. Зарегистрировано Департаментом юстиции Актюбинской области 29 ноября 2013 года № 3689. Утратило силу решением Уилского районного маслихата Актюбинской области от 7 декабря 2018 года № 233
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах Уилского района
  kaz: Ойыл ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
