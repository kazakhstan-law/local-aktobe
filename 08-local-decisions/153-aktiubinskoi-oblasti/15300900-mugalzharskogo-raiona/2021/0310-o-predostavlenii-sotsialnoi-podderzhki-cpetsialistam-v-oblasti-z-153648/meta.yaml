act_code: '153648'
requisite: Решение Мугалжарского районного маслихата Актюбинской области от 10 марта 2021 года № 13. Зарегистрировано Департаментом юстиции Актюбинской области 15 марта 2021 года № 8118
title:
  rus: О предоставлении социальной поддержки cпециалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Мугалжарского района на 2021 год
  kaz: Мұғалжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік  кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер əкімдері аппараттарының мемлекеттік қызметшілеріне 2021 жылға әлеуметтік қолдау көрсету туралы
