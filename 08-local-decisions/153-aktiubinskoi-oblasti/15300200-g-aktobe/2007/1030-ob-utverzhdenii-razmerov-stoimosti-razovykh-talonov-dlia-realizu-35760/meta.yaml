act_code: '35760'
requisite: Решение внеочередной второй сессии маслихата города Актобе Актюбинской области от 30 октября 2007 года N 19. Зарегистрировано в Управлении юстиции города Актобе Актюбинской области 14 ноября 2007 года за N 3-1-78. Утратило силу решением маслихата города Актобе Актюбинской области от 29 января 2009 года N 127
title:
  rus: Об утверждении размеров стоимости разовых талонов для реализующих товары на рынках города Актобе, включая физических лиц, деятельность которых носит эпизодический характер с применением коэффициентов к месячному расчетному показателю, утвержденному на соответствующий период
  kaz: Ақтөбе қаласындағы базарларда тауар сатушыларға және қызметі эпизодикалық сипаттағы жеке тұлғалар үшін бір жолғы талондар құнының мөлшерін, сол кезеңге сәйкес бекітілген айлық есептік көрсеткішіне коэффициенттерді қолдану арқылы бекіту туралы
