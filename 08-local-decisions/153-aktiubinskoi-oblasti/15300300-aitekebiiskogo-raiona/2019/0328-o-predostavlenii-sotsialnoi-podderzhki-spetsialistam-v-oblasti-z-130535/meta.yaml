  title:
    rus: О внесении изменения в решение Айтекебийского районного маслихата от 28 марта 2019 года № 274 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Айтекебийского района на 2019 год»
    kaz: Әйтеке би аудандық мәслихатының 2019 жылғы 28 наурыздағы № 274 «2019 жылға арналған Әйтеке би ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/133661/rus
