requisite: Решение маслихата Мартукского района Актюбинской области от 28 марта 2008 года N 39. Зарегистрировано Управлением юстиции Мартукского района Актюбинской области 15 апреля 2008 года N 3-8-51. Утратило силу решением маслихата Мартукского района Актюбинской области от 4 ноября 2016 года № 40
title:
  rus: Об установлении надбавок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, работающим в сельских населенных пунктах Мартукского района
  kaz: Мәртөк ауданының ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға үстемақы белгіленуі туралы
