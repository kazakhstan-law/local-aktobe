requisite: Решение маслихата Каргалинского района Актюбинской области от 20 декабря 2013 года № 172. Зарегистрировано Департаментом юстиции Актюбинской области 22 января 2014 года № 3762. Утратило силу решением Каргалинского районного маслихата Актюбинской области от 7 декабря 2018 года № 288
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Каргалинского района
  kaz: Қарғалы ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек көрсету туралы
