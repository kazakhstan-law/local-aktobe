requisite: Решение Шалкарского районного маслихата Актюбинской области от 14 декабря 2018 года № 282. Зарегистрировано Управлением юстиции Шалкарского района Департамента юстиции Актюбинской области 14 декабря 2018 года № 3-13-221. Утратило силу решением Шалкарского районного маслихата Актюбинской области от 13 июля 2020 года № 510
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Шалкарского района
  kaz: Шалқар ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
