act_code: '86098'
requisite: Решение от 23.12.2014 №173, Маслихат Кобдинского района. Утратило силу решением Хобдинского районного маслихата Актюбинской области от 26 мая 2015 года № 205
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Хобдинского района в 2015 году
  kaz: 2015 жылы Қобда ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы
