  title:
    rus: О внесении изменения в решение Шалкарского районного маслихата от 24 декабря 2018 года № 293 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Шалкарского района на 2019 год
    kaz: Шалқар аудандық мәслихатының 2018 жылғы 24 желтоқсандағы № 293 «Шалқар ауданының ауылдық елді мекендеріне жұмыс iстеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылға әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
