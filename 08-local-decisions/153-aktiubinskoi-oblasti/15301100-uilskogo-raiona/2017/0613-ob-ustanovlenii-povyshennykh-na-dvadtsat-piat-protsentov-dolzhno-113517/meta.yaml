act_code: '113517'
requisite: Решение маслихата Уилского района Актюбинской области от 13 июня 2017 года № 106. Зарегистрировано Департаментом юстиции Актюбинской области 13 июля 2017 года № 5594. Утратило силу решением Уилского районного маслихата Актюбинской области от 27 сентября 2019 года № 333
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности по Уилскому району
  kaz: Ойыл ауданы бойынша азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға, жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы
