requisite: Ақтөбе облысы Қобда аудандық мәслихатының 2008 жылғы 20 желтоқсандағы N 68 шешімі. Ақтөбе облысының Қобда аудандық әділет басқармасында 2009 жылдың 15 қаңтарда N 3-7-57 тіркелді. Күші жойылды - Ақтөбе облысы Қобда аудандық мәслихатының 2009 жылғы 25 желтоқсандағы № 128 шешімімен
