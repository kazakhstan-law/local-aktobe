requisite: Решение Темирского районного маслихата Актюбинской области от 17 февраля 2017 года № 85. Зарегистрировано Департаментом юстиции Актюбинской области 7 марта 2017 года № 5298. Утратило силу решением Темирского районного маслихата Актюбинской области от 10 января 2019 года № 318
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах Темирского района»
  kaz: Азаматтық қызметші болып табылатын және Темір ауданының ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарына жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
