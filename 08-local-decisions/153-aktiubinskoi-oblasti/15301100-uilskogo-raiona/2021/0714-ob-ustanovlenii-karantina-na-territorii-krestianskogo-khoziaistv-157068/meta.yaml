requisite: Решение акима сельского округа имени Шыганака Берсиева Уилского района Актюбинской области от 14 июля 2021 года № 23. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 июля 2021 года № 23557. Утратило силу решением акима сельского округа имени Шыганака Берсиева Уилского района Актюбинской области от 12 августа 2021 года № 29
