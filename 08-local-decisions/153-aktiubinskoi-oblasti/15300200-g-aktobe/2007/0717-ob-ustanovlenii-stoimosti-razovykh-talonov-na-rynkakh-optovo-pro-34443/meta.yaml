requisite: Решение внеочередной сороковой сессии маслихата города Актобе Актюбинской области от 17 июля 2007 года N 363. Зарегистрировано в Управлении юстиции города Актобе Актюбинской области 2 августа за N 3-1-76. Утратило силу решением маслихата города Актобе Актюбинской области от 25 апреля 2009 года N 169
