  title:
    rus: О внесении изменений в решение Байганинского районного маслихата от 13 марта 2015 года № 160 «Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах по Байганинскому району»
    kaz: Байғанин аудандық мәслихатының 2015 жылғы 13 наурыздағы № 160 «Байғанин ауданы бойынша азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгілеу туралы» шешіміне өзгерістер енгізу туралы
