requisite: Решение маслихата Мугалжарского района Актюбинской области от 12 апреля 2016 года № 12. Зарегистрировано Департаментом юстиции Актюбинской области 05 мая 2016 года № 4887
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мугалжарского района на 2016 год
  kaz: 2016 жылға Мұғалжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы
