  title:
    rus: О внесении изменений в решение районного маслихата от 31 марта 2010 года № 182 "Об утверждении правил предоставления жилищной помощи малообеспеченным гражданам на оплату за содержание жилища, на капитальный ремонт и взносы на накопление средств на капитальный ремонт общего имущества объектов кондоминиума, потребление коммунальных услуг и услуг связи в части увеличения абонентской платы за телефон"
    kaz: Аудандық мәслихаттың 2010 жылғы 31 наурыздағы № 182 "Аудандық бюджеттен тұрғын үйді ұстау, коммуналдық қызметті, байланыс қызметін тұтыну төлемақысы және кондоминиум объектісінің ортақ мүлкін күрделі жөндеудің жекелеген түрлеріне жұмсалатын шығындар өтемақысы бойынша аз қамтылған азаматтарға тұрғын үй көмегін көрсету Қағидасын" бекіту туралы шешіміне өзгерістер енгізу туралы
