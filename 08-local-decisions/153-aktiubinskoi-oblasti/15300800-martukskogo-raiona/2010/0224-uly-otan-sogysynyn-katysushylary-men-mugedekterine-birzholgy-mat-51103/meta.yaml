requisite: Ақтөбе облысы Мәртөк аудандық мәслихатының 2010 жылғы 24 ақпандағы N 160 шешімі. Ақтөбе облысы Мәртөк аудандық Әділет басқармасында 2010 жылғы 12 наурызда N 3-8-108 тіркелді. Қолданылу мерзімі аяқталуына байланысты күші жойылды - Ақтөбе облысы Мәртөк аудандық мәслихатының 2011 жылғы 15 қарашадағы № 487 хатымен
