requisite: Решение Хромтауского районного маслихата Актюбинской области от 25 декабря 2019 года № 395. Зарегистрировано Департаментом юстиции Актюбинской области 27 декабря 2019 года № 6633. Утратило силу решением Хромтауского районного маслихата Актюбинской области от 24 августа 2020 года № 495
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Хромтауского района на 2020 год
  kaz: 2020 жылға арналған Хромтау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы
