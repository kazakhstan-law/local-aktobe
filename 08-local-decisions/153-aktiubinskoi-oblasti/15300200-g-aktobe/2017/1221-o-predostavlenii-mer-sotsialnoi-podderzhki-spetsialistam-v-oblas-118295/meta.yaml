act_code: '118295'
requisite: Решение маслихата города Актобе Актюбинской области от 21 декабря 2017 года № 271. Зарегистрировано Департаментом юстиции Актюбинской области 18 января 2018 года № 5872. Утратило силу решением маслихата города Актобе Актюбинской области от 28 августа 2018 года № 361
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Актобе на 2018 год
  kaz: Ақтөбе қаласының ауылдық елді мекендеріне 2018 жылға жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау шараларын ұсыну туралы
