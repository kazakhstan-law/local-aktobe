  title:
    rus: О внесении изменения в решение районного маслихата от 19 декабря 2008 года № 75 «Темір ауданы Темір қаласының сатуға арналған жерлерін аймақтарға бөлу сызбасы және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы»
    kaz: Аудандық мәслихаттың 2008 жылғы 19 желтоқсандағы № 75 «Темір ауданы Темір қаласының сатуға арналған жерлерін аймақтарға бөлу сызбасы және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы» шешіміне өзгеріс енгізу туралы
