act_code: '166060'
requisite: Решение Темирского районного маслихата Актюбинской области от 18 марта 2022 года № 169
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Темирского района на 2022 год
  kaz: Темір ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық  округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2022 жылға әлеуметтік қолдау шараларын көрсету туралы
