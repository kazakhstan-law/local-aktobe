act_code: '128451'
requisite: Решение Кобдинского районного маслихата Актюбинской области от 4 января 2019 года № 208. Зарегистрировано Управлением юстиции Кобдинского района Департамента юстиции Актюбинской области 11 января 2019 года № 3-7-190
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Кобдинского района на 2019 год
  kaz: Қобда ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылға әлеуметтік қолдау көрсету туралы
