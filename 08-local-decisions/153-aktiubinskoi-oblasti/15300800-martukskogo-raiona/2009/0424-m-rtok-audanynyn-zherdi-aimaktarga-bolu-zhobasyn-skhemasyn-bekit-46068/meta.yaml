requisite: Ақтөбе облысы Мәртөк аудандық мәслихатының 2009 жылғы 24 сәуірдегі N 108 шешімі. Ақтөбе облысы Мәртөк аудандық әділет басқармасында 2009 жылғы 21 мамырда N 3-8-87 тіркелді. Күші жойылды - Ақтөбе облысы Мәртөк аудандық мәслихатының 2009 жылғы 24 шілдедегі № 125 шешімімен
