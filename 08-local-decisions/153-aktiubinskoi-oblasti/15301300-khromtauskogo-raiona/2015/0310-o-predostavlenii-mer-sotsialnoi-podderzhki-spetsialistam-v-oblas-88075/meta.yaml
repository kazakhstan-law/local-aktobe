act_code: '88075'
requisite: Решение Хромтауского районного маслихата Актюбинской области от 10 марта 2015 года № 234. Зарегистрировано Департаментом юстиции Актюбинской области 3 апреля 2015 года № 4280. Срок действия решения - до 1 января 2016 года
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Хромтауского района на 2015 год
  kaz: Хромтау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2015 жылға әлеуметтік қолдау шараларын ұсыну туралы
