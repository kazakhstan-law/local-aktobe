  kaz: Жергілікті бюджеттен қаржыландырылатын «Мәртөк аудандық жұмыспен қамту және әлеуметтік бағдарламалар бөлімі» мемлекеттік мекемесінің «Қамқор» отбасын қолдау орталығы» коммуналдық мемлекеттік мекемесі қызметкерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу туралы
