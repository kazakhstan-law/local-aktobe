requisite: Решение маслихата города Актобе Актюбинской области от 4 марта 2015 года № 319. Зарегистрировано Департаментом юстиции Актюбинской области 19 марта 2015 года № 4244. Утратило силу решением маслихата города Актобе Актюбинской области от 14 декабря 2018 года № 389
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах города Актобе
  kaz: Ақтөбе қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
