  title:
    rus: О внесении изменений в решение Шалкарского районного маслихата от 15 сентября 2023 года № 105 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Шалкарском районе»
