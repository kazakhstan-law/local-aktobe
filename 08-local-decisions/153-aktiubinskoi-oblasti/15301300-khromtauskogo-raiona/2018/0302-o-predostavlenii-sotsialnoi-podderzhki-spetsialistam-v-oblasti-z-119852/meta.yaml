act_code: '119852'
requisite: Решение маслихата Хромтауского района Актюбинской области от 2 марта 2018 года № 187. Зарегистрировано Управлением юстиции Хромтауского района Актюбинской области 19 марта 2018 года № 3-12-159
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Хромтауского района на 2018 год
  kaz: Хромтау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылға әлеуметтік қолдау көрсету туралы
