requisite: Ақтөбе облысы Темір аудандық мәслихатының 2009 жылғы 23 сәуірдегі N 115 шешімі. Ақтөбе облысының Темір аудандық әділет басқармасында 2009 жылдың 21 мамырда N 3-10-105 тіркелді. Күші жойылды - Темір аудандық мәслихатының 2009 жылғы 8 маусымдағы N 129 шешімімен
title:
