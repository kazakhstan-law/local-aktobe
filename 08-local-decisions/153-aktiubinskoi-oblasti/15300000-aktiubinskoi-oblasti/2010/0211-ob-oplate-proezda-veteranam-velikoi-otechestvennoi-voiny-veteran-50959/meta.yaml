act_code: '50959'
requisite: Решение маслихата Актюбинской области от 11 февраля 2010 года № 281. Зарегистрировано Департаментом юстиции Актюбинской области 4 марта 2010 года за № 3328
title:
  rus: Об оплате проезда ветеранам Великой Отечественной войны, ветеранам боевых действий на территории других государств, ветеранам, приравненным по льготам к ветеранам Великой Отечественной войны, лицам с инвалидностью первой, второй, третьей групп, детям с инвалидностью до 16 лет и сопровождающих их лиц
  kaz: Ұлы Отан соғысының ардагерлеріне, басқа мемлекеттердің аумағындағы ұрыс қимылдарының ардагерлеріне, жеңілдіктер бойынша Ұлы Отан соғысының ардагерлеріне теңестірілген ардагерлерге және бірінші, екінші, үшінші топтағы мүгедектігі бар адамдарға, 16 жасқа дейінгі мүгедектігі бар балаларға және оларды ертіп жүрген адамдарға жол жүру төлемдері туралы
