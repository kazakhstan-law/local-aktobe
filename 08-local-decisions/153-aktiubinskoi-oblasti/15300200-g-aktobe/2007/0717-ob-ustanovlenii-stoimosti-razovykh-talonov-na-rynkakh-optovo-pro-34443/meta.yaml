  requisite: Решение внеочередной второй сессии маслихата города Актобе Актюбинской области от 30 октября 2007 года N 18. Зарегистрировано в Управлении юстиции города Актобе Актюбинской области 14 ноября 2007 года за N 3-1-79. Утратило силу решением маслихата города Актобе Актюбинской области от 25 апреля 2009 года N 169
  title:
    rus: 'О внесении изменений и дополнений в решение N 363 внеочередной сороковой сессии маслихата города Актобе от 17 июля 2007 года "Об установлении стоимости разовых талонов на рынках: "Оптово-продовольственный рынок города Актобе" и крытый рынок "Кар сити", зарегистрированного в управлении юстиции города Актобе 2 августа 2007 года за N 3-1-76'
    kaz: Ақтөбе қалалық мәслихатының кезектен тыс қырқыншы сессиясының 2007 жылғы 17 шілдедегі "Ақтөбе қаласы көтерме сауда азық-түлік базары" және "Кар сити" жабық базарының бір жолғы талондар құнын белгілеу туралы" әділет басқармасында 2007 жылғы 2 тамызда N 3-1-76 санымен тіркелген N 363 шешіміне өзгерістер мен толықтырулар енгізу туралы
