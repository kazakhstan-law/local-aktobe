act_code: '131685'
requisite: Решение Мартукского районного маслихата Актюбинской области от 14 мая 2019 года № 264. Зарегистрировано Департаментом юстиции Актюбинской области 17 мая 2019 года № 6154. Утратило силу решением Мартукского районного маслихата Актюбинской области от 20 августа 2020 года № 404
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Мартукского района
  kaz: Мәртөк ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
