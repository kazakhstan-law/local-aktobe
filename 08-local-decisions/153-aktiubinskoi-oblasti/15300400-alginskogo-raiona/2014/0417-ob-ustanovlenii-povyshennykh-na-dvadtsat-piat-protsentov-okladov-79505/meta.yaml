  code: '156861'
  requisite: Решение Алгинского районного маслихата Актюбинской области от 23 июня 2021 года № 54. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 июля 2021 года № 23351
  title:
    rus: О внесении изменений в решение Алгинского районного маслихата от 17 апреля 2014 года № 151 «Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта являющимся гражданскими служащими и работающим в сельских населенных пунктах Алгинского района»
    kaz: Алға аудандық мәслихатының 2014 жылғы 17 сәуірдегі № 151 «Алға ауданының азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт саласынының мамандарына жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгілеу туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/156861/rus
