act_code: '28514'
requisite: Қызылорда облысы Қармақшы ауданы Ақжар ауылдық округінің әкімінің 2006 жылғы 14 наурыздағы № 28 шешімі.  Қызылорда облысының Әділет басқармасында 2006 жылғы 16 наурызда № 10-5-39 болып тіркелді
