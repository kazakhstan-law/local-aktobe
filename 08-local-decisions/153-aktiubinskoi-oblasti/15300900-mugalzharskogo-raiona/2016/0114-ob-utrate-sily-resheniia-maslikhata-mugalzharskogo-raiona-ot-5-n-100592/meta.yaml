act_code: '100592'
requisite: Решение маслихата Мугалжарского района Актюбинской области от 14 января 2016 года № 277
title:
  rus: Об утрате силы решения маслихата Мугалжарского района от 5 ноября 2015 года № 250 «Об утверждении Методики ежегодной оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Мугалжарского районного маслихата»»
  kaz: Мұғалжар аудандық мәслихатының 2015 жылғы 5 қарашадағы № 250 ««Мұғалжар аудандық мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалау әдістемесін бекіту туралы» шешімінің күшін жою туралы
