requisite: Решение маслихата Мугалжарского района Актюбинской области от 21 декабря 2016 года № 60. Зарегистрировано Департаментом юстиции Актюбинской области 12 января 2017 года № 5223
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мугалжарского района на 2017 год
  kaz: 2017 жылға Мұғалжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы
