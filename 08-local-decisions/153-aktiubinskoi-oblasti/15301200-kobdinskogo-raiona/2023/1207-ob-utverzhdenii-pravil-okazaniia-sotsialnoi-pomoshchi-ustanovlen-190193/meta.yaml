  title:
    rus: О внесении изменения в решение Кобдинского районного маслихата от 7 декабря 2023 года № 92 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Кобдинском районе»
