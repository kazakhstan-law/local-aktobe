  title:
    rus: О внесении изменений в решение Мартукского районного маслихата от 10 июня 2015 года № 179 "О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Мартукского района в 2015 году"
    kaz: Мәртөк аудандық мәслихаттың "Мәртөк ауданының ауылдық елді мекендеріне 2015 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы" 2015 жылғы 10 маусымдағы № 179 шешіміне өзгерістер енгізу туралы
