act_code: '119745'
requisite: Решение маслихата Алгинского района Актюбинской области от 1 марта 2018 года № 147. Зарегистрировано Управлением юстиции Алгинского района Актюбинской области 19 марта 2018 года № 3-3-149
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Алгинского района на 2018 год
  kaz: Алға ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылға әлеуметтік қолдау шараларын көрсету туралы
