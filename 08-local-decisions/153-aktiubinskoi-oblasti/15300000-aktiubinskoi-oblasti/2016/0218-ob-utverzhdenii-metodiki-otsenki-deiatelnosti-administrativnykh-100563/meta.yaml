  title:
    rus: О внесении изменений в решение областного маслихата от 18 февраля 2016 года № 391 "Об утверждении методики оценки деятельности административных государственных служащих корпуса "Б" государственного учреждения "Аппарат Актюбинского областного маслихата"
    kaz: Облыстық мәслихаттың 2016 жылғы 18 ақпандағы № 391 "Ақтөбе облыстық мәслихатының аппараты" мемлекеттік мекемесінің "Б" корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы" шешіміне өзгерістер енгізу туралы
