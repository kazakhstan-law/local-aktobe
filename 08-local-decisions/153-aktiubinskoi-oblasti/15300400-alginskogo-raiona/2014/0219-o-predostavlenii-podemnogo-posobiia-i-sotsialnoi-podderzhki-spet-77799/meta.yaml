requisite: Решение маслихата Алгинского района Актюбинской области от 19 февраля 2014 года № 134. Зарегистрировано Департаментом юстиции Актюбинской области 6 марта 2014 года № 3799. Утратило силу решением маслихата Алгинского района Актюбинской области от 24 декабря 2014 года № 182
title:
  rus: О предоставлении подъемного пособия и социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Алгинского района в 2014 году
  kaz: 2014 жылға арналған Алға ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы мен әлеуметтік қолдауды көрсету туралы
