act_code: '43232'
requisite: Ақтөбе облысы Әйтеке би аудандық әкімиятының 2008 жылғы 23 желтоқсандағы N 4 шешімі. Ақтөбе облысының Әйтеке би аудандық әділет басқармасында 2009 жылдың 6 қаңтарда N 3-2-66 тіркелді. Күші жойылды - Ақтөбе облысы Әйтеке би аудандық әкімінің 2010 жылғы 15 ақпандағы № 1 шешімімен
