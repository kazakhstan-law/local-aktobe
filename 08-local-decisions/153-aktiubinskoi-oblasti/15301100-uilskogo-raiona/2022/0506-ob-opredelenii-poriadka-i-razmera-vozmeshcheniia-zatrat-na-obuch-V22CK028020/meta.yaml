    kaz: Ақтөбе облысы Ойыл аудандық мәслихатының 2022 жылғы 6 мамырдағы № 137 «Ойыл ауданында мүгедектігі бар адамдар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
