requisite: Решение Хромтауского районного маслихата Актюбинской области от 30 сентября 2019 года № 357. Зарегистрировано Департаментом юстиции Актюбинской области 7 октября 2019 года № 6403. Утратило силу решением Хромтауского районного маслихата Актюбинской области от 28 марта 2024 года № 151
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по городу Хромтау
  kaz: Хромтау қаласы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
