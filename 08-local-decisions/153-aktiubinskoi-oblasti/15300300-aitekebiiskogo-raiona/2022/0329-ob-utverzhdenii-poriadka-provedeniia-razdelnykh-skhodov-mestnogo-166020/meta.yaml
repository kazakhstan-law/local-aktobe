requisite: Решение Айтекебийского районного маслихата Актюбинской области от 29 марта 2022 года № 165. Утратило силу решением Айтекебийского районного маслихата Актюбинской области от 9 октября 2023 года № 109
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия  в сходе местного сообщества на территории населенных пунктов Айтекебийского района
  kaz: Әйтеке би ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
