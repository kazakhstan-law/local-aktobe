  title:
    rus: О внесении изменения в решение Уилского районного маслихата от 8 февраля 2019 года № 259 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Уилского района на 2019 год»
    kaz: Ойыл аудандық мәслихатының 2019 жылғы 8 ақпандағы № 259 «Ойыл ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылға әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
