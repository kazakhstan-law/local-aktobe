  title:
    rus: О внесении изменения в решение Кобдинского районного маслихата от 02 марта 2018 года № 137 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Кобдинского районного маслихата»»
    kaz: Қобда аудандық мәслихатының 2018 жылғы 2 наурыздағы № 137 ««Қобда аудандық мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалаудың әдістемесін бекіту туралы» шешіміне өзгеріс енгізу туралы
