requisite: Решение маслихата Мугалжарского района Актюбинской области от 26 мая 2014 года № 168. Зарегистрировано Департаментом юстиции Актюбинской области 06 июня 2014 года № 3923. Утратило силу решением маслихата Мугалжарского района Актюбинской области от 15 февраля 2016 года № 283
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных  ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности по Мугалжарскому району
  kaz: Мұғалжар ауданы бойынша азаматтық қызметші болып табылатын және ауылдық  жерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік ставкаларды белгілеу туралы
