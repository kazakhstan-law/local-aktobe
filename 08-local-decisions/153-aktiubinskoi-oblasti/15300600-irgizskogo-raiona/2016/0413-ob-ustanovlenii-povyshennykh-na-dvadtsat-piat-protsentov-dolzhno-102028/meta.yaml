  title:
    rus: О внесении изменения в решение районного маслихата от 13 апреля 2016 года № 12 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельской местности по Иргизскому району»
    kaz: Аудандық мәслихаттың 2016 жылғы 13 сәуірдегі № 12 «Ырғыз ауданы бойынша азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы» шешіміне өзгеріс енгізу туралы
