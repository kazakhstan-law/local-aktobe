requisite: Решение маслихата Иргизского района Актюбинской области от 1 ноября 2012 года № 39. Зарегистрировано Департаментом юстиции Актюбинской области 22 ноября 2012 года № 3449. Утратило силу решением маслихата Иргизского района Актюбинской области от 11 июля 2013 года № 85
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мемлекеттік ұйымдары мамандарына отын сатып алуға әлеуметтік көмек көрсету туралы
