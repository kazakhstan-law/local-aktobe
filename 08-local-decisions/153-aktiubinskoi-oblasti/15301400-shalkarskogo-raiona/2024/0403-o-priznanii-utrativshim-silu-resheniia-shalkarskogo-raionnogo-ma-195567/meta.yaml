act_code: '195567'
requisite: Решение Шалкарского районного маслихата Актюбинской области от 3 апреля 2024 года № 226. Зарегистрировано Департаментом юстиции Актюбинской области 8 апреля 2024 года № 8563-04
title:
  rus: О признании утратившим силу решения Шалкарского районного маслихата от 16 февраля 2024 года № 190 «Об оказании дополнительной социальной помощи отдельным категориям нуждающихся граждан Шалкарского района к 35-летию вывода ограниченного контингента советских войск из Демократической Республики Афганистан»
  kaz: Шалқар аудандық мәслихатының 2024 жылғы 16 ақпандағы № 190 «Ауғанстан Демократиялық Республикасынан Кеңес әскерлерінің шектеулі контингентін шығаруының 35-жылдығына орай Шалқар ауданының мұқтаж азаматтарының санаттарына қосымша әлеуметтік көмек көрсету туралы» шешімінің күшін жою туралы
