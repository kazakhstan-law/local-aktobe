  title:
    rus: О внесении изменений и дополнения в решение маслихата города Актобе от 23 ноября 2016 года № 114 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в городе Актобе»
    kaz: Ақтөбе қалалық мәслихатының 2016 жылғы 23 қарашадағы № 114 «Ақтөбе қаласында әлеуметтік көмек көрсету, мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау Қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
