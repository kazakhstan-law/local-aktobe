act_code: '80648'
requisite: Решение маслихата Темирского района Актюбинской области от 28 мая 2014 года № 189. Зарегистрировано Департаментом юстиции Актюбинской области 10 июня 2014 года № 3931. Утратило силу решением маслихата Темирского района Актюбинской области от 17 февраля 2017 года № 85
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах Темирского района
  kaz: Азаматтық қызметші болып табылатын және Темір ауданының ауылдық елді  мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарына жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік ставкалар белгілеу туралы
