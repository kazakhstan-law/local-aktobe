requisite: Ақтөбе облысы Қобда аудандық мәслихатының 2009 жылғы 22 шілдедегі N 100 шешімі. Ақтөбе облысының Қобда аудандық әділет басқармасында 2009 жылдың 28 тамызда N 3-7-74 тіркелді. Күші жойылды - Ақтөбе облысы Қобда аудандық мәслихатының 2012 жылғы 28 маусымдағы № 34 шешімімен
