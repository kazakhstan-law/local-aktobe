  title:
    rus: О внесении изменений в решение маслихата города Актобе от 25 мая 2018 года № 336 «Об утверждении схемы зонирования земель города Актобе для установления границ ценовых зон и дифференциации базовых ставок земельного налога в пределах границ, определенных Генеральным планом города Актобе»
    kaz: Ақтөбе қалалық мәслихатының 2018 жылғы 25 мамырдағы № 336 «Ақтөбе қаласының дамуының Бас жоспарында анықталған шекте жерге жер салығына базалық ставкаларды дифференциациялау мен бағалау аймақтары шекараларын белгілеу үшін Ақтөбе қаласы жерлерін аймақтарға бөлу схемасын бекіту туралы» шешіміне өзгерістер енгізу туралы
