act_code: '131784'
requisite: Решение Айтекебийского районного маслихата Актюбинской области от 16 мая 2019 года № 291. Зарегистрировано Департаментом юстиции Актюбинской области 20 мая 2019 года № 6166. Утратило силу решением Айтекебийского районного маслихата Актюбинской области от 24 августа 2020 года № 449
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Айтекебийского района
  kaz: Әйтеке би ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
