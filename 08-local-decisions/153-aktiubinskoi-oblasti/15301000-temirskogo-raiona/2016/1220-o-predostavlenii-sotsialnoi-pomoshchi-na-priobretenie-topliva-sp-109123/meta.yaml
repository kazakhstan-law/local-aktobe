act_code: '109123'
requisite: Решение маслихата Темирского района Актюбинской области от 20 декабря 2016 года № 60. Зарегистрировано Департаментом юстиции Актюбинской области 9 января 2017 года № 5201. Утратило силу решением маслихата Темирского района Актюбинской области от 28 августа 2018 года № 244
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Темирского района
  kaz: Темір ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
