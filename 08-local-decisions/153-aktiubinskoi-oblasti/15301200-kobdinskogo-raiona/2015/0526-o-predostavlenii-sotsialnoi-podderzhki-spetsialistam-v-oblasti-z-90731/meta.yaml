requisite: Решение Хобдинского районного маслихата Актюбинской области от 26 мая 2015 года № 205. Зарегистрировано Департаментом юстиции Актюбинской области 17 июня 2015 года № 4361. Заголовок решения с изменением, внесенным решением Хобдинского районного маслихата Актюбинской области от 4 ноября 2015 года № 221. Утратило силу решением маслихата Хобдинского района Актюбинской области от 29 февраля 2016 года № 268
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Хобдинского района на 2015 год
  kaz: 2015 жылға Қобда ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы
