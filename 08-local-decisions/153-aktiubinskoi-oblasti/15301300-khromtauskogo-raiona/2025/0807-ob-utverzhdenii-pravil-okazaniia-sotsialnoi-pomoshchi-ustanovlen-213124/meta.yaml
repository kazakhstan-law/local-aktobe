    rus: О внесении изменения в решение Хромтауского районного маслихата Актюбинской области от 7 августа 2025 года № 348 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Хромтауском районе»
