act_code: '132583'
requisite: Решение Уилского районного маслихата Актюбинской области от 6 июня 2019 года № 306. Зарегистрировано Департаментом юстиции Актюбинской области 13 июня 2019 года № 6251. Утратило силу решением Уилского районного маслихата Актюбинской области от 17 августа 2020 года № 423
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Уилского района
  kaz: Ойыл ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
