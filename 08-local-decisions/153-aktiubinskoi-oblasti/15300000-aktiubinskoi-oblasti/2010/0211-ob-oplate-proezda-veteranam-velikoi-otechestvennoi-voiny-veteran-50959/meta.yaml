  title:
    rus: О внесении изменений в решение областного маслихата от 11 февраля 2010 года № 281 «Об оплате проезда ветеранам Великой Отечественной войны, ветеранам боевых действий на территории других государств, ветеранам, приравненным по льготам к ветеранам Великой Отечественной войны, инвалидам I, II, III групп, инвалидам с детства до 16 лет и сопровождающих их лиц»
    kaz: «Ұлы Отан соғысының ардагерлеріне, басқа мемлекеттердің аумағындағы ұрыс қимылдарының ардагерлеріне, жеңілдіктер бойынша Ұлы Отан соғысының ардагерлеріне теңестірілген ардагерлерге және I, II, III топтағы мүгедектерге, 16 жасқа дейінгі бала кезінен мүгедектерге және оларды ертіп жүрген адамдарға жол жүру төлемдері туралы» облыстық мәслихаттың 2010 жылғы 11 ақпандағы № 281 шешіміне өзгерістер енгізу туралы
