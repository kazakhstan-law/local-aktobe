act_code: '41012'
requisite: Ақтөбе облысы Мұғалжар ауданы Батпақкөл ауылдық округі әкімінің 2008 жылғы 30 маусымдағы N 9 шешімі. Ақтөбе облысының Мұғалжар аудандық әділет басқармасында 2008 жылдың 4 тамызда N 3-9-69 тіркелді
