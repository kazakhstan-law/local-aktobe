requisite: Ақтөбе облысы Әйтеке би аудандық мәслихатының 2009 жылғы 24 шілдедегі N 132 шешімі. Ақтөбе облысының Әйтеке би аудандық әділет басқармасында 2009 жылдың 4 тамызында N 3-2-83 тіркелді. Күші жойылды - Ақтөбе облысы Әйтеке би аудандық мәслихатының 2012 жылғы 10 тамыздағы № 39 шешімімен
title:
  rus: Ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау ретінде көтерме жәрдемақы беру туралы
