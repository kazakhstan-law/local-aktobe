title:
  rus: Об отмене действия решения маслихата города Актобе от 6 ноября 2015 года № 382 «Об утверждении методики ежегодной оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат маслихата города Актобе»
  kaz: «Ақтөбе қалалық мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалау әдістемесін бекіту туралы» Ақтөбе қалалық мәслихатының 2015 жылғы 6 қарашадағы № 382 шешімінің қолдану әрекетін жою туралы
