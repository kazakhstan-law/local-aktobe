act_code: '60060'
requisite: Решение маслихата Кобдинского района Актюбинской области от 27 июля 2011 года № 215. Зарегистрировано Департаментом юстиции Актюбинской области 16 августа 2011 года № 3-7-123. Утратило силу в связи с истечением срока действия - письмо маслихата Кобдинского района Актюбинской области от 10 мая 2012 года № 5-05/46
title:
  rus: Об оказании социальной помощи на приобретение топлива 2011 году специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах Кобдинского района
  kaz: Қобда ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін 2011 жылға әлеуметтік көмек беру туралы
