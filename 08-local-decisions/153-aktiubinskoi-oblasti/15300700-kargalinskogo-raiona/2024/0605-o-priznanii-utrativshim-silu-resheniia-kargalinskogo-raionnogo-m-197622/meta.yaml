act_code: '197622'
requisite: Решение Каргалинского районного маслихата Актюбинской области от 5 июня 2024 года № 172. Зарегистрировано Департаментом юстиции Актюбинской области 10 июня 2024 года № 8591-04
title:
  rus: О признании утратившим силу решения Каргалинского районного маслихата от 9 февраля 2024 года № 128 «Об оказании дополнительной социальной помощи отдельным категориям нуждающихся граждан Каргалинского района к 35-летию вывода ограниченного контингента советских войск из Демократической Республики Афганистан»
  kaz: Қарғалы аудандық мәслихатының 2024 жылғы 9 ақпандағы № 128 «Ауғанстан Демократиялық Республикасынан Кеңес әскерлерінің шектеулі контингентін шығаруының 35-жылдығына орай Қарғалы ауданының мұқтаж азаматтарының санаттарына қосымша әлеуметтік көмек көрсету туралы» шешімінің күшін жою туралы
