act_code: '43815'
requisite: Ақтөбе облысы Мұғалжар аудандық әкімдігінің 2008 жылғы 24 желтоқсандағы N 5 шешімі. Ақтөбе облысының Мұғалжар аудандық әділет басқармасында 2009 жылдың 26 қаңтарда N 3-9-92 тіркелді. Күші жойылды - Ақтөбе облысы Мұғалжар ауданының әкімінің 2009 жылғы 27 желтоқсандағы N 27 шешімімен
