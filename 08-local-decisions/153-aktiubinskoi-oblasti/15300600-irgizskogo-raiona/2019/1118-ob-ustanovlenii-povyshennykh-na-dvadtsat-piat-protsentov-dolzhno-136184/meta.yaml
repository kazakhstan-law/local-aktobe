  title:
    rus: О внесении изменений в решение Иргизского районного маслихата от 18 ноября 2019 года № 251 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры и спорта, являющимся гражданскими служащими и работающим в сельской местности по Иргизскому району»
    kaz: Ырғыз аудандық мәслихатының 2019 жылғы 18 қарашадағы № 251 «Ырғыз ауданы бойынша азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/162234/rus
