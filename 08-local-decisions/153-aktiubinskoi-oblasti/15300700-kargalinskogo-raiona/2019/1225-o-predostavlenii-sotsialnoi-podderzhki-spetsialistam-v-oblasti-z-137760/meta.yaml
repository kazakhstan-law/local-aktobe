  title:
    rus: О внесении изменений в решение Каргалинского районного маслихата от 25 декабря 2019 года № 397 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Каргалинского района на 2020 год»
    kaz: Қарғалы аудандық мәслихатының 2019 жылғы 25 желтоқсандағы № 397 «2020 жылға арналған Қарғалы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/146856/rus
