  title:
    rus: О внесений изменений в решение Иргизского районного маслихата от 29 марта 2013 года № 63 «Об определении категории граждан, расходы которых по арендной плате за пользование жилищем в частном жилищном фонде и арендных домах возлагаются на местный бюджет»
    kaz: Ырғыз аудандық мәслихатының 2013 жылғы 29 наурыздағы № 63 «Жеке тұрғын үй қорындағы және жалға берілген тұрғын үйлердегі тұрғын үйді пайдаланғаны үшін жалдау ақысының шығыстары  жергілікті бюджетке жүктелетін азаматтар санатын белгілеу туралы» шешіміне өзгерістер енгізу туралы
