  title:
    rus: О внесении изменений в решение Каргалинского районного маслихата от 22 декабря 2016 года № 87 «Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах Каргалинского района»
    kaz: Қарғалы аудандық мәслихатының 2016 жылғы 22 желтоқсандағы № 87 «Азаматтық қызметшілер болып табылатын және Қарғалы ауданының ауылдық елді мекендерінде жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға, жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы» шешіміне өзгерістер енгізу туралы
