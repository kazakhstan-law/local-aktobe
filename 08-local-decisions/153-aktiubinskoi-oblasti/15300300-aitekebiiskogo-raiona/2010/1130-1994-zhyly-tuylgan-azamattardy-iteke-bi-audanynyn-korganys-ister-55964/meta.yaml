act_code: '55964'
requisite: Ақтөбе облысы Әйтеке би аудандық әкімдігінің 2010 жылғы 30 қарашадағы № 8 шешімі. Ақтөбе облысы Әйтеке би ауданының Әділет басқармасында 2010 жылғы 13 желтоқсанда № 3-2-101 тіркелді. Қолданылу мерзімі аяқталуына байланысты күші жойылды - Ақтөбе облысы Әйтеке би аудандық әкімінің 2012 жылғы 6 маусымдағы № 2 шешімімен
