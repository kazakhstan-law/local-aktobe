requisite: Ақтөбе облысы Мұғалжар аудандық мәслихатының 2008 жылғы 26 маусымдағы N 53 шешімі. Ақтөбе облысының Мұғалжар аудандық әділет басқармасында 2008 жылдың 18 шілдеде N 3-9-65 тіркелді. Күші жойылды - Мұғалжар аудандық мәслихатының 2009 жылғы 25 маусымдағы N 126 шешімімен
