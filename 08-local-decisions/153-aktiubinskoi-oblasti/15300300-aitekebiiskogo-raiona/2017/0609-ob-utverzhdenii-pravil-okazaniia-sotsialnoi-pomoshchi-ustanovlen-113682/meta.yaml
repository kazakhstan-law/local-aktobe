  title:
    rus: О внесении изменений в решение Айтекебийского районного маслихата от 9 июня 2017 года № 132 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в Айтекебийском районе»
    kaz: Әйтеке би аудандық мәслихатының 2017 жылғы 9 маусымдағы № 132 «Әйтеке би ауданында әлеуметтік көмек көрсету, мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
