act_code: '89428'
requisite: Решение маслихата города Актобе Актюбинской области от 6 апреля 2015 года № 325. Зарегистрировано Департаментом юстиции Актюбинской области 6 мая 2015 года № 4321. Утратило силу решением маслихата города Актобе Актюбинской области от 15 января 2016 года № 417
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты города Актобе в 2015 году
  kaz: Ақтөбе қаласының ауылдық елді мекендеріне 2015 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау шараларын ұсыну туралы
