act_code: '203836'
requisite: Решение Мугалжарского районного маслихата Актюбинской области от 2 декабря 2024 года № 311
title:
  rus: О предоставлении социальной поддержки cпециалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Мугалжарского района на 2025 год
  kaz: Мұғалжар ауданының ауылдық елді мекендеріне жұмыс істеу және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер əкімдері аппараттарының мемлекеттік қызметшілеріне 2025 жылға әлеуметтік қолдау көрсету туралы
