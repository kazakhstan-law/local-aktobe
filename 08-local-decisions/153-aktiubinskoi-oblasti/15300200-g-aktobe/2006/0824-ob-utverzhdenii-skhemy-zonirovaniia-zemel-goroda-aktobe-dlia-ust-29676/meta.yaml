act_code: '29676'
requisite: Решение очередной тридцать первой сессии маслихата города Актобе Актюбинской области от 24 августа 2006 года N 263. Зарегистрировано Управлением юстиции города Актобе 15 сентября 2006 года N 3-1-56. Утратило силу решением маслихата города Актобе Актюбинской области от 25 мая 2018 года № 336
title:
  rus: Об утверждении схемы зонирования земель города Актобе для установления границ ценовых зон и дифференциации базовых ставок платы за землю и базовых ставок земельного налога в пределах границ, определенных Генеральным планом города Актобе
  kaz: Ақтөбе қаласы дамуының Бас жоспарымен анықталған шегінде жерге және жер салығына базалық ставкаларын дифференциациялау мен бағалау аймақтары шекараларын белгілеу үшін Ақтөбе қаласы жерлерін аймақтарға бөлу сызбасын бекіту туралы
