act_code: '163293'
requisite: Решение Каргалинского районного маслихата Актюбинской области от 22 декабря 2021 года № 81
title:
  rus: О представлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Каргалинского района на 2022 год
  kaz: Қарғалы ауданының ауылдық елді мекендеріге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға,ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2022 жылға әлеуметтік қолдау көрсету туралы
