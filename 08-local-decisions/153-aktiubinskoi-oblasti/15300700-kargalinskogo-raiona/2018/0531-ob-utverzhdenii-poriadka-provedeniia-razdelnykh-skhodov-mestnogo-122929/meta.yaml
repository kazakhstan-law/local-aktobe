requisite: Решение Каргалинского районного маслихата Актюбинской области от 31 мая 2018 года № 239. Зарегистрировано Управлением юстиции Каргалинского района Департамента юстиции Актюбинской области 22 июня 2018 года № 3-6-164. Утратило силу решением Каргалинского районного маслихата Актюбинской области от 3 февраля 2022 года № 108
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории населенных пунктов Каргалинского района
  kaz: Қарғалы ауданының елді мекендері аумағындағы бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары  өкілдерінің санын айқындау тәртібін бекіту туралы
