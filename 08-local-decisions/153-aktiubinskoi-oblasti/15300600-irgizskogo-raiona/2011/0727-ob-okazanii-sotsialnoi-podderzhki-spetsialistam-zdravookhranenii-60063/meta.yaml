requisite: Решение маслихата Иргизского района Актюбинской области от 27 июля 2011 года № 180. Зарегистрировано Департаментом юстиции Актюбинской области 16 августа 2011 года № 3-5-139. Утратило силу в связи с истечением срока действия - письмо маслихата Иргизского района Актюбинской области от 15 ноября 2012 года № 182
title:
  rus: Об оказании социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта прибывшим для работы и проживания в сельские населенные пункты района на 2011 год
  kaz: Ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2011 жылға әлеуметтік қолдау көрсету туралы
