    kaz: Әйтеке би аудандық мәслихатының 2024 жылғы 9 ақпандағы № 175 «Әйтеке би ауданында бөлшек салықтың арнаулы салық режимін қолдану кезінде салық мөлшерлемесінің мөлшерін төмендету туралы» шешімінің күшін жою туралы
