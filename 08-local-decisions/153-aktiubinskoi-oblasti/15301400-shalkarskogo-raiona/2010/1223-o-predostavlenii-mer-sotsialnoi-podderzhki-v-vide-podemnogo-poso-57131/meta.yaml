requisite: Решение маслихата Шалкарского района Актюбинской области от 23 декабря 2010 года № 229. Зарегистрировано Управлением юстиции Шалкарского района Актюбинской области 26 января 2011 года № 3-13-143. Утратило силу решением маслихата Шалкарского района Актюбинской области от 10 августа 2012 года № 33
title:
  rus: О предоставлении мер социальной поддержки в виде подъемного пособия и кредит для приобретения жилья специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты в 2011 году
  kaz: 2011 жылға ауданның ауылдық елді мекендерге жұмыс істеуге және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау мақсатында көтерме жәрдемақы және тұрғын үй сатып алу үшін кредит ұсыну туралы
