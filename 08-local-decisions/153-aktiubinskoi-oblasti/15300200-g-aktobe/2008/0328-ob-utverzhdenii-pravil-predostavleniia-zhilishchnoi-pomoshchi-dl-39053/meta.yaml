act_code: '39053'
requisite: Решение очередной пятой сессии маслихата города Актобе от 28 марта 2008 года N 56. Зарегистрировано в Управлении юстиции города Актобе Актюбинской области 21 апреля 2008 года за N 3-1-85. Утратило силу решением маслихата города Актобе Актюбинской области от 27 октября 2009 года № 198
title:
  rus: Об утверждении Правил предоставления жилищной помощи для возмещения расходов за потребление коммунальных услуг и компенсации повышения тарифов абонентской платы за телефон населению города Актобе
  kaz: Ақтөбе қаласының тұрғындарына коммуналдық қызметтерді тұтынғаны үшін және телефонға абоненттік ақы тарифтерінің өсуіне байланысты шығындарды өтеуге арналған тұрғын үй көмегін беру қағидасын бекіту туралы
