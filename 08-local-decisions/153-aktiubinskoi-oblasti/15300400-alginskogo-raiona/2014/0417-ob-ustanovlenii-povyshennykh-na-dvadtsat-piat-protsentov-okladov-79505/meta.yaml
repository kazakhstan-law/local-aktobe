act_code: '79505'
requisite: Решение маслихата Алгинского района Актюбинской области от 17 апреля 2014 года № 151. Зарегистрировано Департаментом юстиции Актюбинской области 5 мая 2014 года № 3888
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, культуры являющимся гражданскими служащими и работающим в сельских населенных пунктах Алгинского района
  kaz: Алға ауданының азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет саласынының мамандарына жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгілеу туралы
