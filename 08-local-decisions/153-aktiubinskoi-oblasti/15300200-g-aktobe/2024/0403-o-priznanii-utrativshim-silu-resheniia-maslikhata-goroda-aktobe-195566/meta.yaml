act_code: '195566'
requisite: Решение маслихата города Актобе Актюбинской области от 3 апреля 2024 года № 155. Зарегистрировано Департаментом юстиции Актюбинской области 8 апреля 2024 года № 8562-04
title:
  rus: О признании утратившим силу решения маслихата города Актобе от 8 февраля 2024 года № 143 «Об оказании дополнительной социальной помощи отдельным категориям нуждающихся граждан города Актобе к 35 – летию вывода ограниченного контингента советских войск из Демократической Республики Афганистан»
  kaz: Ақтөбе қалалық мәслихатының 2024 жылғы 8 ақпандағы № 143 «Ауғанстан Демократиялық Республикасынан Кеңес әскерлерінің шектеулі контингентін шығаруының 35-жылдығына орай Ақтөбе қаласының мұқтаж азаматтарының санаттарына қосымша әлеуметтік көмек көрсету туралы» шешімінің күшін жою туралы
