act_code: '8343'
requisite: Решение акима Актюбинской области от 23 января 2001 года № 8. Зарегистрировано Управлением юстиции Актюбинской области 6 марта 2001 года № 942
title:
  rus: О приеме в коммунальную собственность автомобильных дорог области, находящихся в государственной собственности и не входящих в перечень автомобильных дорог общего пользования республиканского значения, а также сооружений на них и распределении их по видам коммунальной собственности
  kaz: Мемлекеттік меншіктегі және республикалық маңызы бар жалпы пайдаланымдағы автомобиль жолдары тізбесіне енбеген облыстағы автомобиль жолдарын, сондай-ақ ондағы мемлекеттік меншіктегі құрылыстарды коммуналдық меншікке қабылдау туралы
