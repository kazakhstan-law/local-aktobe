requisite: Ақтөбе облысы Алға аудандық мәслихатының 2009 жылғы 24 сәуірдегі N 5 шешімі. Ақтөбе облысының Алға аудандық әділет басқармасында 2009 жылдың 19 мамырдағы N 3-3-79 тіркелді. Күші жойылды - Ақтөбе облысы Алға аудандық мәслихатының 2010 жылғы 22 ақпандағы № 4 шешімімен
