  title:
    rus: О внесении изменений в решение Алгинского районного маслихата от 16 ноября 2023 года № 78 «Об утверждении Правил оказания социальной помощи, установления её размеров и определения перечня отдельных категорий нуждающихся граждан в Алгинском районе»
    kaz: Алға аудандық мәслихатының 2023 жылғы 16 қарашадағы № 78 «Алға ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
