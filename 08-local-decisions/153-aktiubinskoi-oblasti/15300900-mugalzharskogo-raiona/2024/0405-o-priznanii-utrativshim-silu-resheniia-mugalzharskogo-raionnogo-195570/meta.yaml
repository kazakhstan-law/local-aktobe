act_code: '195570'
requisite: Решение Мугалжарского районного маслихата Актюбинской области от 5 апреля 2024 года № 176. Зарегистрировано Департаментом юстиции Актюбинской области 9 апреля 2024 года № 8565-04
title:
  rus: О признании утратившим силу решения Мугалжарского районного маслихата от 6 февраля 2024 года № 165 «Об оказании дополнительной социальной помощи отдельным категориям нуждающихся граждан по Мугалжарскому району к 35 – летию вывода ограниченного контингента советских войск из Демократической Республики Афганистан»
  kaz: Мұғалжар аудандық мәслихатының 2024 жылғы 6 ақпандағы № 165 «Ауғанстан Демократиялық Республикасынан Кеңес әскерлерінің шектеулі контингентін шығаруының 35-жылдығына орай Мұғалжар ауданы бойынша мұқтаж азаматтарының санаттарына қосымша әлеуметтік көмек көрсету туралы» шешімінің күшін жою туралы
