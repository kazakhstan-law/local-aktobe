act_code: '186763'
requisite: Решение Каргалинского районного маслихата Актюбинской области от 30 декабря 2022 года № 228
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Каргалинского района на 2023 год
  kaz: Қарғалы ауданының ауылдық елді мекендеріге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2023 жылға әлеуметтік қолдау шараларын көрсету туралы
