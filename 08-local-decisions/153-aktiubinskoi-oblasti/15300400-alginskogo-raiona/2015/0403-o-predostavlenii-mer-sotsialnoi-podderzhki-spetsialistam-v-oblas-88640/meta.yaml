  title:
    rus: О внесении изменений и дополнений в решение от 03 апреля 2015 года № 199 "О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Алгинского района в 2015 году"
    kaz: '"Алға ауданының ауылдық елді мекендеріне 2015 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы" 2015 жылғы 3 сәуірдегі № 199 шешіміне өзгерістер мен толықтырулар енгізу туралы'
