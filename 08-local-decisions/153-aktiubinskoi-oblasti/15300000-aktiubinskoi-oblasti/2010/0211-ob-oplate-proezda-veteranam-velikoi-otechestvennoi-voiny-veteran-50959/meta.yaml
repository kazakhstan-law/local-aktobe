  title:
    rus: О внесении изменений в решение областного маслихата от 11 февраля 2010 года № 281 «Об оплате проезда участников и инвалидов Великой Отечественной войны, лиц, приравненных к ним, инвалидов I, II, III групп, инвалидов с детства до 16 лет и сопровождающих их лиц»
    kaz: Облыстық мәслихаттың 2010 жылдың 11 ақпандағы № 281 «Ұлы Отан соғысының қатысушылары мен мүгедектерінің, соларға теңестірілген адамдардың, I, II, III топтағы мүгедектердің, 16 жасқа дейінгі бала кезінен мүгедектердің және оларды ертіп жүрген адамдардың жол жүру төлемдері туралы» шешіміне өзгерістер енгізу туралы
