act_code: '42631'
requisite: Ақтөбе облысы Мұғалжар ауданы Қ. Жұбанов атындағы ауылдық округі әкімінің 2008 жылғы 20 қарашадағы N 3 шешімі. Ақтөбе облысының Мұғалжар аудандық әділет басқармасында 2008 жылдың 2 желтоқсанда N 3-9-85 тіркелді
title:
  rus: Қ. Жұбанов атындағы ауылдық округіне қарасты Жаңатұрмыс ауылындағы көшеге атау беру туралы
  kaz: Қ. Жұбанов атындағы ауылдық округіне қарасты Жаңатұрмыс ауылындағы көшеге атау беру туралы
