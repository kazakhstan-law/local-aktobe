requisite: Ақтөбе облысы Қобда аудандық әкімінің 2009 жылғы 26 қарашадағы № 11 шешімі. Ақтөбе облысы Қобда ауданының Әділет басқармасында 2009 жылдың 29 желтоқсанда № 3-7-81 тіркелді. Күші жойылды - Ақтөбе облысы Қобда аудандық әкімінің 2011 жылғы 7 ақпандағы № 4 шешімімен
