requisite: Ақтөбе облысы Ырғыз аудандық әкімиятының 2008 жылғы 15 желтоқсандағы N 5 шешімі. Ақтөбе облысының Ырғыз аудандық Әділет басқармасында 2009 жылдың 6 қаңтарда N 3-5-84 тіркелді. Күші жойылды - Ақтөбе облысы Ырғыз аудандық әкімиятының 2009 жылғы 9 желтоқсандағы N 8 шешімімен
