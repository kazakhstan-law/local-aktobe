act_code: '100418'
requisite: Решение маслихата Айтекебийского района Актюбинской области от 29 февраля 2016 года № 305
title:
  rus: О признание утратившим силу решение районного маслихата № 238 от 29 мая 2015 года «Об определении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Айтекебийского района в 2015 году»
  kaz: Аудандық мәслихатының 2015 жылғы 12 мамырдағы № 238 «Әйтеке би ауданының ауылдық елді мекендеріне 2015 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау шараларын ұсыну туралы» шешімінің күшін жою туралы
