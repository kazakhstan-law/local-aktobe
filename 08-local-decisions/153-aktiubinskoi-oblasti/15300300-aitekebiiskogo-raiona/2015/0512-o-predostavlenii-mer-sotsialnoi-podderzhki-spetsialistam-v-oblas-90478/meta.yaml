  title:
    rus: О внесении изменений в решение районного малихата от 12 мая 2015 года № 238 "О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Айтекебийского района в 2015 году"
    kaz: '"Әйтеке би ауданының ауылдық елді мекендеріне 2015 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет,спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну туралы" 2015 жылғы 12 мамырдағы № 238 аудандық мәслихаттың шешіміне өзгерістер енгізу туралы'
