    rus: О внесений изменения в решение Хромтауского районного маслихата от 3 апреля 2019 года № 309 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Хромтауского района на 2019 год»
    kaz: Хромтау аудандық мәслихатының 2019 жылғы 3 сәуірдегі № 309 «2019 жылға арналған Хромтау ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
