  title:
    rus: О внесении изменений в решение Караглинского районного маслихата от 30 декабря 2022 года № 228 «О представлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Каргалинского района на 2023 год»
    kaz: Қарғалы аудандық мәслихатының 2022 жылғы 30 желтоқсандағы № 228 «Қарғалы ауданының ауылдық елді мекендеріге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2023 жылға әлеуметтік қолдау көрсету туралы» шешіміне өзгерістер  енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/186583/rus
