act_code: '111063'
requisite: Решение маслихата Айтекебийского района Актюбинской области от 17 февраля 2017 года № 102. Зарегистрировано Департаментом юстиции Актюбинской области 7 марта 2017 года № 5302. Утратило силу решением Айтекебийского районного маслихата Актюбинской области от 2 октября 2019 года № 319
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеренарии, являющимся гражданскими служащими и работающим в сельской местности по Айтекебийскому району
  kaz: Әйтеке би ауданы бойынша азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеренария саласындағы мамандарға, жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы
