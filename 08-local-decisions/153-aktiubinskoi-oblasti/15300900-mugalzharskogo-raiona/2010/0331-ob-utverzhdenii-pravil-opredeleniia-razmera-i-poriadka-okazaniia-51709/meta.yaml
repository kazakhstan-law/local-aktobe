title:
  rus: Об утверждении Правил определения размера и порядка оказания жилищной помощи малообеспеченным семьям (гражданам) в Мугалжарском районе
  kaz: Мұғалжар ауданында аз қамтамасыз етілген отбасыларына (азаматтарға) тұрғын үй көмегін көрсетудің мөлшерін және тәртібін айқындау Қағидасын бекіту туралы
