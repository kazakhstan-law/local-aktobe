  title:
    rus: О внесении изменений в решение районного маслихата от 28 октября 2011 года № 263 "Об оказании социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах Айтекебийского района
    kaz: Аудандық мәслихаттың 2011 жылғы 28 қазандағы № 263 "Әйтеке би ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы" шешіміне өзгерістер енгізу туралы
