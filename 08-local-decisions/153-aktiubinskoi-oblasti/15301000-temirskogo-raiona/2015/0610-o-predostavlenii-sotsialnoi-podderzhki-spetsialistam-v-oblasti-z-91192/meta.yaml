  title:
    rus: О внесении изменений в решение районного маслихата от 10 июня 2015 года № 252 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Темирского района»
    kaz: Аудандық мәслихаттың 2015 жылғы 10 маусымдағы № 252 «Темір ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау шараларын ұсыну туралы» шешіміне өзгерістер енгізу туралы
