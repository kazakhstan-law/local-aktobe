act_code: '45804'
requisite: Ақтөбе облысы Әйтеке би аудандық мәслихатының 2009 жылғы 21 сәуірдегі № 126 шешімі. Ақтөбе облысының Әйтеке би аудандық әділет басқармасында 2009 жылдың 12 мамырда № 3-2-80 тіркелді
title:
