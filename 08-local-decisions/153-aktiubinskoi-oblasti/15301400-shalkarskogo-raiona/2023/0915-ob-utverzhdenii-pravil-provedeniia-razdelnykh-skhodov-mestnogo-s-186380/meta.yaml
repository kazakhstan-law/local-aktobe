  title:
    rus: О внесении изменения в решение Шалкарского районного маслихата от 15 сентября 2023 года № 94 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей сел для участия в сходе местного сообщества Актогайского сельского округа Шалкарского района Актюбинской области»
