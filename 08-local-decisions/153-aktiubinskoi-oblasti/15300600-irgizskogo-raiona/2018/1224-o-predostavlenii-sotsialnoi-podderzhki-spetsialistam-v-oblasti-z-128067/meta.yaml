  title:
    rus: О внесении изменения в решение районного маслихата от 24 декабря 2018 года № 189 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Иргизского района на 2019 год»
    kaz: Аудандық мәслихаттың 2018 жылғы 24 желтоқсандағы № 189 «Ырғыз ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2019 жылға әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
