act_code: '106141'
requisite: Решение маслихата Актюбинской области от 17 августа 2016 года № 51. Зарегистрировано Департаментом юстиции Актюбинской области 15 сентября 2016 года № 5074
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, архивного дела, спорта, ветеринарии и лесного хозяйства, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметші болып табылатын және ауылдық жерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, архив ісі, спорт, ветеринария және орман шаруашылығы саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелерді белгілеу туралы
