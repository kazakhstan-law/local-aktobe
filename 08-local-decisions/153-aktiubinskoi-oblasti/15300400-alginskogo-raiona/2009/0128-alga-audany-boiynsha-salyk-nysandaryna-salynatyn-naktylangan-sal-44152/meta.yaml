requisite: Ақтөбе облысы Алға аудандық мәслихатының 2009 жылғы 28 қаңтардағы N 2 шешімі. Ақтөбе облысының Алға аудандық әділет басқармасында 2009 жылдың 13 ақпандағы N 3-3-70 тіркелді. Күші жойылды - Ақтөбе облысы Алға аудандық мәслихатының 2012 жылғы 7 ақпандағы № 14 шешімімен
