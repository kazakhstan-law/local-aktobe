requisite: Ақтөбе облысы Алға аудандық мәслихатының 2009 жылғы 20 қазандағы № 3 шешімі. Ақтөбе облысының Алға аудандық Әділет басқармасында 2009 жылдың 16 қарашада № 3-3-91 тіркелді. Күші жойылды - Ақтөбе облысы Алға аудандық мәслихатының 2012 жылғы 21 желтоқсандағы № 64 шешімімен
title:
