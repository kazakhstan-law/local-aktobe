requisite: Решение маслихата Иргизского района Актюбинской области от 12 декабря 2017 года № 116. Зарегистрировано Департаментом юстиции Актюбинской области 27 декабря 2017 года № 5769
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса прибывшим для работы и проживания в сельские населенные пункты Иргизского района на 2018 год
  kaz: Ырғыз ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2018 жылға әлеуметтік қолдау көрсету туралы
