    kaz: Аудандық мәслихаттың 2015 жылғы 10 маусымдағы № 252 «Темір ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы» шешіміне өзгеріс енгізу туралы
