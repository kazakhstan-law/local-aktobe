act_code: '195804'
requisite: Решение Каргалинского районного маслихата Актюбинской области от 11 апреля 2024 года № 158
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Каргалинского района на 2024 год
  kaz: Қарғалы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2024 жылға әлеуметтік қолдау көрсету туралы
