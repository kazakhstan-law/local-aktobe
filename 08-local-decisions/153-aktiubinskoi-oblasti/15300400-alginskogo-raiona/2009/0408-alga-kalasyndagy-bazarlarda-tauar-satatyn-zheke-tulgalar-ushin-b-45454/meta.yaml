act_code: '45454'
requisite: Ақтөбе облысы Алға аудандық мәслихатының 2009 жылғы 8 сәуірдегі N 4 шешімі. Ақтөбе облысының Алға аудандық әділет басқармасында 2009 жылдың 27 сәуірде N 3-3-74 тіркелді. Күші жойылды - Ақтөбе облысы Алға аудандық мәслихатының 2012 жылғы 21 желтоқсандағы № 64 шешімімен
