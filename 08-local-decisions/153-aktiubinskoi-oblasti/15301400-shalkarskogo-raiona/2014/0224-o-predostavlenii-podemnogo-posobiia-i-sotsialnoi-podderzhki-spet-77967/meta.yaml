requisite: Решение маслихата Шалкарского района Актюбинской области от 24 февраля 2014 года № 134. Зарегистрировано Департаментом юстиции Актюбинской области 12 марта 2014 года № 3804. Утратило силу решением маслихата Шалкарского района Актюбинской области от 24 декабря 2014 года № 188
title:
  rus: О предоставлении подъемного пособия и социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района в 2014 году
  kaz: 2014 жылы ауданның ауылдық елді мекендеріне жұмыс істеу және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына көтерме жәрдемақы мен әлеуметтік қолдау ұсыну туралы
