requisite: Решение маслихата Байганинского района Актюбинской области от 28 марта 2012 года № 13. Зарегистрировано Департаментом юстиции Актюбинской области 9 апреля 2012 года № 3-4-145. Утратило силу в связи с истечением срока применения - (письмо маслихата Байганинского района Актюбинской области от 17 января 2013 года № 04-13/13)
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные пункты района в 2012 году
  kaz: Аудандық ауылдық елді мекендеріне 2012 жылы  жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына қолдау көрсету туралы
