requisite: Ақтөбе облысы Қобда аудандық мәслихатының 2009 жылғы 24 сәуірдегі № 87 шешімі. Ақтөбе облысының Қобда аудандық Әділет басқармасында 2009 жылдың 20 мамырда № 3-7-67 тіркелді. Қолданылу мерзімі аяқталуына байланысты күші жойылды - (Ақтөбе облысы Қобда аудандық мәслихатының 2013 жылғы 31 қаңтардағы № 5-05/11 хатымен)
