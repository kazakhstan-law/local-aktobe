title:
  rus: О признании утратившим силу решения Айтекебийского районного маслихата от 9 февраля 2024 года № 175 «О понижении размера ставки налогов при применении специального налогового режима розничного налога в Айтекебийском районе»
  kaz: Әйтеке би аудандық мәслихатының 2024 жылғы 9 ақпандағы № 175 «Әйтеке би ауданында бөлшек салықтың арнаулы салық режимін қолдану кезінде салық мөлшерлемесінің мөлшерін төмендету туралы» шешімінің күшін жою туралы
