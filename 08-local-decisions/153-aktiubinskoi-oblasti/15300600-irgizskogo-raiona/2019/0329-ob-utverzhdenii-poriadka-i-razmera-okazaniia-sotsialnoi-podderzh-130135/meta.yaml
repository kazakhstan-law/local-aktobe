  title:
    rus: О внесении изменений в решение Иргизского районного маслихата от 29 марта 2019 года № 216 «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Иргизского района»
    kaz: Ырғыз аудандық мәслихатының 2019 жылғы 29 наурыздағы № 216 «Ырғыз ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы» шешіміне өзгерістер енгізу туралы
