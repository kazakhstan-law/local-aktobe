act_code: '47586'
requisite: Ақтөбе облысы Байғанин аудандық мәслихатының 2009 жылғы 24 шілдедегі № 103 шешімі. Ақтөбе облысының Байғанин аудандық әділет басқармасында 2009 жылдың 27 тамызда N 3-4-83 тіркелді.
