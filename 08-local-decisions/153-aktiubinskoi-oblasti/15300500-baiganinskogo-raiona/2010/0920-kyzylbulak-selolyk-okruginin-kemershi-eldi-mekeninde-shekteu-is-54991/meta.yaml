act_code: '54991'
requisite: Ақтөбе облысы Байғанин ауданы Қызылбұлақ селолық округі әкімінің 2010 жылғы 20 қыркүйектегі № 5 шешімі. Ақтөбе облысының Байғанин аудандық Әділет басқармасында 2010 жылғы 19 қазанда № 3-4-103 тіркелді. Күші жойылды - Ақтөбе облысы Байғанин ауданы Қызылбұлақ селолық округі әкімінің 2010 жылғы 17 қарашадағы № 8 шешімімен
title:
